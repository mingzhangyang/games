name: Temporary Silk Dew Verify
on:
  push:
    branches:
      - feat/silk-dew-difficulty-rework
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Silk Dew difficulty
        run: node scripts/verify-silk-dew-levels.mjs
