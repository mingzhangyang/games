name: Temporary Silk Dew Verify
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Verify Silk Dew difficulty
        run: node scripts/verify-silk-dew-levels.mjs
      - name: Smoke Silk Dew in Chrome
        run: |
          node scripts/serve-static.mjs 8899 > /tmp/silk-dew-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          node scripts/smoke-silk-dew.mjs
