# TEMPORARY PR #136 EVIDENCE JOB. Remove this workflow before merging the PR.
# Opt-in only: edit the PR body to add [runtime-profile-request].
# This workflow is not executed on ordinary pushes or PR synchronizations.
name: PR 136 runtime profile evidence (opt-in)

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  profile:
    if: github.event.pull_request.number == 136 && contains(github.event.pull_request.body, '[runtime-profile-request]') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Quick cross-game scenario probe
        run: |
          npm run profile:runtime -- --all --viewports=mobile,desktop --preset=quick --repeat=1 --out=.tmp-perf/pr136-quick
          cat .tmp-perf/pr136-quick/summary.md
      - name: Full first-pass cross-game baseline
        run: |
          npm run profile:runtime -- --all --viewports=mobile,desktop --preset=baseline --repeat=1 --out=.tmp-perf/pr136-baseline
          cat .tmp-perf/pr136-baseline/summary.md
      - name: Display incomplete runs when a sampler fails
        if: failure()
        run: |
          for file in .tmp-perf/pr136-*/summary.md; do
            if [ -f "$file" ]; then echo "RESULTS: $file"; cat "$file"; fi
          done
      - name: Upload raw profile and generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr136-runtime-profile-evidence
          path: .tmp-perf/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
