name: Architecture v2 candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      # Docs stay in the filter so a docs-only PR still produces the `verify` check.
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'src/**'
      - 'worker/**'
      - 'Workers/**'
      - 'public/**'
      - 'assets/**'
      - 'js/**'
      - 'tests/**'
      - 'tools/**'
      - 'css/**'
      - '*.html'
      - 'games.config.json'
      - 'games.schema.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/architecture-v2.yml'
      - '.github/workflows/deploy-workers.yml'

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.ref }}
  cancel-in-progress: true

# One full candidate run, split into parallel jobs so wall time is the slowest job, not the sum:
#   static  — production build, every offline check (gen/lint/contracts/solvers), Worker dry runs
#   browser — the browser suites against source *and* the built-output gate set against dist/
#             (`dist:<name>` steps), balanced across shards by tests/verify-all.mjs --shard.
# To change the shard count, edit `shard` and SHARDS together.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This one-time comparison uses the precise pre-migration Step 4 merge SHA.
      # Do not run on other PRs or merged main (future header edits are allowed).
      - name: Chrome step 5a pre/post DOM parity
        if: github.head_ref == 'refactor/chrome-step5a-registry-topbar'
        run: |
          git fetch --no-tags --depth=1 origin 46f2aad08beb0a6221b012473e69efa1f903bdea
          node tools/checks/compare-topbar-html.mjs 46f2aad08beb0a6221b012473e69efa1f903bdea

      # Prove a fresh checkout works without dist before generating build output.
      # Browser shards below still verify the real stamped build after build.
      - name: Service Worker source-only regression
        run: node tools/checks/verify-service-worker-source.mjs

      - name: Production build
        run: npm run build

      - name: Offline verification
        run: node tests/verify-all.mjs --offline

      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Analytics Worker dry run (no production deployment)
        run: npx wrangler deploy -c Workers/wrangler-games-analytics.jsonc --dry-run --outdir .wrangler-analytics-dry-run

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: '1'
      SHARDS: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Simplified Chinese browser font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          fc-match 'WenQuanYi Micro Hei'

      # dist:* steps re-run the shared layout/theme/chrome gates and art smokes on the real build.
      - name: Production build
        run: npm run build

      - name: Browser verification (shard ${{ matrix.shard }})
        run: node tests/verify-all.mjs --browser --with-dist --shard=${{ matrix.shard }}/${SHARDS} --jobs=2

      # Static full-page screenshot audit against the exact pre-migration commit.
      # Both servers disable page JavaScript to exclude nondeterministic game physics;
      # the normal browser suite above still exercises live interactivity.
      - name: Chrome step 5a pixel-exact full-site diff
        if: github.head_ref == 'refactor/chrome-step5a-registry-topbar' && matrix.shard == 1
        run: |
          git fetch --no-tags --depth=1 origin 46f2aad08beb0a6221b012473e69efa1f903bdea
          git worktree add --detach /tmp/chrome-step5a-before 46f2aad08beb0a6221b012473e69efa1f903bdea
          (cd /tmp/chrome-step5a-before && node tests/lib/serve-static.mjs 8898) > /tmp/chrome5a-before.log 2>&1 &
          BEFORE_PID=$!
          node tests/lib/serve-static.mjs 8899 > /tmp/chrome5a-after.log 2>&1 &
          AFTER_PID=$!
          trap 'kill "$BEFORE_PID" "$AFTER_PID" || true' EXIT
          sleep 2
          node tools/checks/compare-topbar-screenshots.mjs http://127.0.0.1:8898 http://127.0.0.1:8899

      # Capture every desktop viewport in both languages for the step-4 chrome review.
      # Do not launch 168 expensive screenshots on superseded/cancelled PR runs.
      # One shard only, on chrome PRs, to avoid unnecessary browser work and CI storage.
      - name: Full-site desktop topbar screenshots
        if: always() && !cancelled() && matrix.shard == 1 && contains(github.event.pull_request.title, 'chrome')
        env:
          LANGS: 'zh,en'
          SHOTS_VIEWPORTS: '1280x900,1440x900,1920x1080'
        run: |
          node tests/lib/serve-static.mjs 8899 > /tmp/topbar-shots-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tools/dev/shots.mjs /tmp/chrome-step4-desktop-shots http://127.0.0.1:8899

      - name: Upload full-site screenshots
        if: always() && !cancelled() && matrix.shard == 1 && contains(github.event.pull_request.title, 'chrome')
        uses: actions/upload-artifact@v4
        with:
          name: chrome-step4-desktop-all-pages
          path: /tmp/chrome-step4-desktop-shots/*.png
          if-no-files-found: warn
          retention-days: 14

  # Keeps the historical single `verify` check name (e.g. for branch protection): green only
  # when every parallel job above passed.
  verify:
    if: always()
    needs: [static, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All verification jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
