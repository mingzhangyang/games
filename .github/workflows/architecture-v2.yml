name: Architecture v2 candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'src/**'
      - 'worker/**'
      - 'Workers/**'
      - 'public/**'
      - 'assets/**'
      - 'js/**'
      - 'tests/**'
      - 'tools/**'
      - 'css/**'
      - '*.html'
      - 'games.config.json'
      - 'games.schema.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/architecture-v2.yml'

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      VERIFY_JOBS: '2'
      ARCHITECTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Full verification suite
        run: npm run verify -- --jobs=2

      - name: Built-output Tower Defense smoke
        run: node tests/lib/run-smoke-dist.mjs tests/smoke-tower-defense.mjs

      - name: Built-output Sword Flight smoke
        run: node tests/lib/run-smoke-dist.mjs tests/smoke-sword-flight.mjs

      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
