name: Architecture v2 candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'src/**'
      - 'worker/**'
      - 'Workers/**'
      - 'public/**'
      - 'assets/**'
      - 'js/**'
      - 'tests/**'
      - 'tools/**'
      # Sentinel: run architecture verification if the retired scripts/ tree is reintroduced.
      - 'scripts/**'
      - 'css/**'
      - '*.html'
      - 'games.config.json'
      - 'games.schema.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/architecture-v2.yml'

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      VERIFY_JOBS: '2'
      ARCHITECTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Full verification suite
        run: npm run verify -- --jobs=2

      - name: Built-output CSS P3-A behavior gate
        run: node tests/lib/run-smoke-dist.mjs tests/verify-css-p3a.mjs

      - name: Built-output CSS P3-B behavior gate
        run: node tests/lib/run-smoke-dist.mjs tests/verify-css-p3b.mjs

      - name: Built-output CSS P3-C behavior gate
        run: node tests/lib/run-smoke-dist.mjs tests/verify-css-p3c.mjs

      - name: Built-output CSS P3-D behavior gate
        run: node tests/lib/run-smoke-dist.mjs tests/verify-css-p3d.mjs

      - name: Built-output CSS P3-E behavior gate
        run: node tests/lib/run-smoke-dist.mjs tests/verify-css-p3e.mjs

      - name: Built-output Tower Defense smoke
        run: node tests/lib/run-smoke-dist.mjs tests/smoke-tower-defense.mjs

      - name: Built-output Sword Flight smoke
        run: node tests/lib/run-smoke-dist.mjs tests/smoke-sword-flight.mjs

      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      # P4 canary: rebuild the exact production graph with only shared-css-first disabled,
      # then rerun the cascade-sensitive built-output contracts against that dist/.
      - name: CSS P4 canary build without shared-css-first
        env:
          CSS_LAYER_CANARY: '1'
        run: npm run build

      - name: CSS P4 canary behavior gates
        run: |
          node tests/lib/run-smoke-dist.mjs tests/verify-css-p3a.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-css-p3b.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-css-p3c.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-css-p3d.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-css-p3e.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-desktop-frame.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-stats-drawer.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-immersive.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-start-menus.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-theme.mjs
          node tests/lib/run-smoke-dist.mjs tests/verify-chrome.mjs
          node tests/lib/run-smoke-dist.mjs tests/smoke-index.mjs
          node tests/lib/run-smoke-dist.mjs tests/smoke-carrot-pull.mjs
          node tests/lib/run-smoke-dist.mjs tests/smoke-needle-awn.mjs
          node tests/lib/run-smoke-dist.mjs tests/smoke-tower-defense.mjs
