name: Architecture v2 candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'src/**'
      - 'worker/**'
      - 'Workers/**'
      - 'public/**'
      - 'assets/**'
      - 'js/**'
      - 'tests/**'
      - 'tools/**'
      # Sentinel: run architecture verification if the retired scripts/ tree is reintroduced.
      - 'scripts/**'
      - 'css/**'
      - '*.html'
      - 'games.config.json'
      - 'games.schema.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/architecture-v2.yml'

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # P4/P5 deliberately verify both normal and no-plugin production builds.
    # The two built-output browser gate passes can legitimately exceed 30 minutes
    # on slower hosted runners even when every assertion is green.
    timeout-minutes: 45
    env:
      CI: '1'
      VERIFY_JOBS: '2'
      ARCHITECTURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Full verification suite
        run: npm run verify -- --jobs=2

      - name: CSS P4 normal built-output gates
        run: node tests/lib/run-css-p4-dist-gates.mjs

      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      # P4 canary: rebuild the exact production graph with only shared-css-first disabled,
      # then rerun the cascade-sensitive built-output contracts against that dist/.
      - name: CSS P4 canary build without shared-css-first
        env:
          CSS_LAYER_CANARY: '1'
        run: npm run build

      - name: CSS P4 canary built-output gates
        run: node tests/lib/run-css-p4-dist-gates.mjs
