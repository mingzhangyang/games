name: Architecture v2 candidate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      # Docs stay in the filter so a docs-only PR still produces the `verify` check.
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
      - 'src/**'
      - 'worker/**'
      - 'Workers/**'
      - 'public/**'
      - 'assets/**'
      - 'js/**'
      - 'tests/**'
      - 'tools/**'
      - 'css/**'
      - '*.html'
      - 'games.config.json'
      - 'games.schema.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'wrangler.jsonc'
      - 'package*.json'
      - '.github/workflows/architecture-v2.yml'
      - '.github/workflows/deploy-workers.yml'

permissions:
  contents: read

concurrency:
  group: architecture-v2-${{ github.ref }}
  cancel-in-progress: true

# One full candidate run, split into parallel jobs so wall time is the slowest job, not the sum:
#   static  — production build, every offline check (gen/lint/contracts/solvers), Worker dry runs
#   browser — the browser suites against source *and* the built-output gate set against dist/
#             (`dist:<name>` steps), balanced across shards by tests/verify-all.mjs --shard.
# To change the shard count, edit `shard` and SHARDS together.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This one-time comparison uses the precise pre-migration Step 4 merge SHA.
      # Do not run on other PRs or merged main (future header edits are allowed).
      - name: Chrome step 5a pre/post DOM parity
        if: github.head_ref == 'refactor/chrome-step5a-registry-topbar'
        run: |
          git fetch --no-tags --depth=1 origin 46f2aad08beb0a6221b012473e69efa1f903bdea
          node tools/checks/compare-topbar-html.mjs 46f2aad08beb0a6221b012473e69efa1f903bdea

      - name: Step 6c-3 baseline HTML byte parity
        if: github.head_ref == 'refactor/result-overlays-6c3'
        run: |
          git fetch --no-tags --depth=1 origin fa99eb6e64a45a2af7d8cbe6a483329b97dfe15e
          node tools/checks/compare-result-html.mjs fa99eb6e64a45a2af7d8cbe6a483329b97dfe15e

      # Prove a fresh checkout works without dist before generating build output.
      # Browser shards below still verify the real stamped build after build.
      - name: Service Worker source-only regression
        run: node tools/checks/verify-service-worker-source.mjs

      - name: Production build
        run: npm run build

      - name: Offline verification
        run: node tests/verify-all.mjs --offline

      - name: Cloudflare Worker dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Analytics Worker dry run (no production deployment)
        run: npx wrangler deploy -c Workers/wrangler-games-analytics.jsonc --dry-run --outdir .wrangler-analytics-dry-run

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: '1'
      SHARDS: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The apt index refresh has occasionally blocked a shard until its 20-minute
      # timeout. Use the same Noble .deb, independently pinned to Ubuntu's
      # published SHA-256, without apt repositories or system-wide index updates.
      # dpkg installs the fontconfig rules as well as the font, matching the old
      # rendering baseline. Both mirrors and the step itself have finite timeouts.
      - name: Install pinned Simplified Chinese browser font
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          pkg='fonts-wqy-microhei_0.2.0-beta-3.1_all.deb'
          sha256='58d0a29af79ce1fc5c63b4276065f0fce27decf6839835f3f9c2e68d9f84ca20'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          downloaded=0
          for base in \
            'https://archive.ubuntu.com/ubuntu/pool/universe/f/fonts-wqy-microhei' \
            'https://mirrors.edge.kernel.org/ubuntu/pool/universe/f/fonts-wqy-microhei'; do
            echo "Downloading pinned WQY package from $base"
            if curl --fail --location --silent --show-error \
              --connect-timeout 8 --max-time 35 --retry 1 --retry-delay 2 \
              --output "$tmp/$pkg" "$base/$pkg"; then
              downloaded=1
              break
            fi
          done
          if [ "$downloaded" -ne 1 ]; then
            echo '::error::Could not download the pinned WQY font from either mirror'
            exit 1
          fi
          printf '%s  %s\n' "$sha256" "$tmp/$pkg" | sha256sum --check
          sudo dpkg -i "$tmp/$pkg"
          actual="$(fc-match -f '%{family}\n' 'WenQuanYi Micro Hei')"
          echo "Selected Chinese browser font: $actual"
          if [[ "$actual" != *'WenQuanYi Micro Hei'* ]]; then
            echo '::error::WenQuanYi Micro Hei is not available to Chromium'
            exit 1
          fi

      # dist:* steps re-run the shared layout/theme/chrome gates and art smokes on the real build.
      - name: Production build
        run: npm run build

      - name: Browser verification (shard ${{ matrix.shard }})
        run: node tests/verify-all.mjs --browser --with-dist --shard=${{ matrix.shard }}/${SHARDS} --jobs=2

      # Q2-A: preserve real-play viewport screenshots for reviewer inspection.
      # No production deployment; this step runs only on Q2-A PR branches.
      - name: Upload Q2-A mobile screenshots
        if: always() && contains(github.head_ref, 'q2a-')
        uses: actions/upload-artifact@v4
        with:
          name: q2a-mobile-${{ matrix.shard }}
          path: /tmp/games-q2a-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Step 6c-3 pixel-identical result overlays
        if: github.head_ref == 'refactor/result-overlays-6c3' && matrix.shard == 1
        run: |
          git fetch --no-tags --depth=1 origin fa99eb6e64a45a2af7d8cbe6a483329b97dfe15e
          git worktree add --detach /tmp/result6c3-before fa99eb6e64a45a2af7d8cbe6a483329b97dfe15e
          (cd /tmp/result6c3-before && node tests/lib/serve-static.mjs 8898) > /tmp/result6c3-before.log 2>&1 &
          BEFORE_PID=$!
          node tests/lib/serve-static.mjs 8899 > /tmp/result6c3-after.log 2>&1 &
          AFTER_PID=$!
          trap 'kill "$BEFORE_PID" "$AFTER_PID" || true' EXIT
          sleep 2
          node tools/checks/compare-result-screenshots.mjs http://127.0.0.1:8898 http://127.0.0.1:8899

      # Static full-page screenshot audit against the exact pre-migration commit.
      # Both servers disable page JavaScript to exclude nondeterministic game physics;
      # the normal browser suite above still exercises live interactivity.
      - name: Chrome step 5a pixel-exact full-site diff
        if: github.head_ref == 'refactor/chrome-step5a-registry-topbar' && matrix.shard == 1
        run: |
          git fetch --no-tags --depth=1 origin 46f2aad08beb0a6221b012473e69efa1f903bdea
          git worktree add --detach /tmp/chrome-step5a-before 46f2aad08beb0a6221b012473e69efa1f903bdea
          (cd /tmp/chrome-step5a-before && node tests/lib/serve-static.mjs 8898) > /tmp/chrome5a-before.log 2>&1 &
          BEFORE_PID=$!
          node tests/lib/serve-static.mjs 8899 > /tmp/chrome5a-after.log 2>&1 &
          AFTER_PID=$!
          trap 'kill "$BEFORE_PID" "$AFTER_PID" || true' EXIT
          sleep 2
          node tools/checks/compare-topbar-screenshots.mjs http://127.0.0.1:8898 http://127.0.0.1:8899

      # The step-5a PR has a dedicated before/after pixel audit; skip redundant
      # 156-shot Step-4 artifact capture for it (all other Chrome PRs unchanged).
      # Capture every desktop viewport in both languages for the step-4 chrome review.
      # Do not launch 168 expensive screenshots on superseded/cancelled PR runs.
      # One shard only, on chrome PRs, to avoid unnecessary browser work and CI storage.
      - name: Full-site desktop topbar screenshots
        if: always() && !cancelled() && matrix.shard == 1 && contains(github.event.pull_request.title, 'chrome') && github.head_ref != 'refactor/chrome-step5a-registry-topbar'
        env:
          LANGS: 'zh,en'
          SHOTS_VIEWPORTS: '1280x900,1440x900,1920x1080'
        run: |
          node tests/lib/serve-static.mjs 8899 > /tmp/topbar-shots-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          node tools/dev/shots.mjs /tmp/chrome-step4-desktop-shots http://127.0.0.1:8899

      - name: Upload full-site screenshots
        if: always() && !cancelled() && matrix.shard == 1 && contains(github.event.pull_request.title, 'chrome') && github.head_ref != 'refactor/chrome-step5a-registry-topbar'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-step4-desktop-all-pages
          path: /tmp/chrome-step4-desktop-shots/*.png
          if-no-files-found: warn
          retention-days: 14

  # Keeps the historical single `verify` check name (e.g. for branch protection): green only
  # when every parallel job above passed.
  verify:
    if: always()
    needs: [static, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All verification jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
