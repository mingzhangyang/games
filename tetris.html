<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- registry:begin head -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Play Tetris - Cool Edition. A modern take on the classic puzzle game with particle effects and smooth animations.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="https://games.orangely.xyz/tetris.html">
    <meta property="og:title" content="Tetris - Cool Edition">
    <meta property="og:description" content="Play Tetris - Cool Edition. A modern take on the classic puzzle game with particle effects and smooth animations.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-tetris.svg">
    <meta property="og:url" content="https://games.orangely.xyz/tetris.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tetris - Cool Edition">
    <meta name="twitter:description" content="Clear lines with smooth controls on desktop and mobile.">
    <meta name="twitter:image" content="assets/seo/og-tetris.svg">
    <title>Tetris - Cool edition</title>
    <!-- registry:end head -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23667eea'/%3E%3Crect x='14' y='14' width='11' height='11' fill='white'/%3E%3Crect x='26' y='14' width='11' height='11' fill='white' opacity='0.85'/%3E%3Crect x='26' y='26' width='11' height='11' fill='white'/%3E%3Crect x='38' y='26' width='11' height='11' fill='white' opacity='0.7'/%3E%3C/svg%3E">
        <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/tetris.css">
    <link rel="stylesheet" href="css/more-games.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="stars" id="stars"></div>

    <div class="game-container game-shell">
        <header class="game-topbar">
            <div class="tt-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 js/game-chrome.js 统一写） -->
                <button data-chrome="home" class="icon-btn game-icon-btn home-toggle" id="homeBtn" title="Home" aria-label="Home" onclick="location.href='index.html'"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：标题 / HUD，各页自由 -->
            <div class="tt-topbar-center game-topbar-center">
                <h1 class="sr-only">Tetris</h1>
                <div class="game-title-pill">
                    <div class="game-hud-box" id="scoreHud">
                        <span class="hud-label" id="scoreHudLabel">Score</span>
                        <span class="hud-value" id="scoreHud">0</span>
                    </div>
                    <div class="hud-sub">
                        <span id="scoreHudBestLabel">Best</span><b id="scoreHudBest">0</b>
                        <span id="scoreHudLevelLabel">Lv</span><b id="scoreHudLevel">1</b>
                    </div>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → pause → sound → lang -->
            <div class="tt-topbar-actions game-topbar-group">
                <button type="button" class="icon-btn game-icon-btn theme-toggle" id="themeToggle" aria-pressed="false"></button>
                <button data-chrome="stats" type="button" class="icon-btn game-icon-btn game-stats-btn" id="statsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="statsDrawer"></button>
                <button type="button" class="tt-icon-btn game-icon-btn" id="tt-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                <button type="button" class="tt-icon-btn tt-lang-btn game-icon-btn game-icon-btn--wide" id="tt-btn-lang-ui" data-chrome="lang" title="Language" aria-label="Language">中文</button>
            </div>
        </header>

        <main class="game-main">
        <div class="game-board game-stage">
            <canvas id="tetris" width="400" height="800"></canvas>
            <canvas id="particleCanvas" width="400" height="800"></canvas>
            <canvas id="lineClearCanvas" width="400" height="800"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-content">
                    <h2 id="gameOverTitle"></h2>
                    <p id="finalScoreLabel"><span id="finalScore">0</span></p>
                    <button class="btn" id="restartBtn"></button>
                </div>
            </div>
            <div class="combo-display" id="comboDisplay"></div>
        </div>

        <!-- 桌面端常驻侧栏；移动端由底部抽屉接管（同一个 #statsPanels 节点搬家） -->
        <div class="info-panel game-sidebar" id="infoPanel">
            <!-- 控制条置于侧栏首位：侧栏在桌面端限高内部滚动，而开始/暂停/重开
                 是对局中要用的按钮，绝不能落到滚动区之外。排在计分板之后时，
                 1280×900 下 Pause/Restart 正好被截在可视区外面。 -->
            <div class="info-box controls">
                <button class="btn" id="startBtn"></button>
                <button class="btn" id="pauseBtn"></button>
                <button class="btn" id="restartGameBtn"></button>
            </div>
            <div id="statsPanels">
            <div class="info-box" style="margin-bottom:8px;">
                <div class="info-row">
                    <span class="info-label" id="usernameLabel"></span>
                    <input id="usernameInput" type="text" maxlength="20" />
                </div>
                <div id="usernameTip"></div>
            </div>

            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="levelLabel"></span>
                    <span class="score-display" id="level">1</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="linesLabel"></span>
                    <span class="score-display" id="lines">0</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="comboLabel"></span>
                    <span class="score-display" id="combo">0</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row" style="align-items:center;">
                    <span class="info-label" id="nextLabel" style="margin-right:18px;"></span>
                    <canvas id="nextPiece" class="next-piece" width="100" height="100" style="margin:0;"></canvas>
                </div>
            </div>

            <div class="global-scores-panel game-side-card" id="globalScoresPanel">
                <div class="global-scores-header" id="globalScoresHeader">Global Top 5</div>
                <div class="global-scores-list" id="globalScoresList">
                    <div class="loading-scores" id="loadingScores">Loading...</div>
                </div>
            </div>
            </div>

        </div>
        </main>

    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只放无状态导航；Sound / Lang 是状态开关，唯一真源在 header。 -->
    <footer class="tt-footer game-footer">
        <p class="tt-footer-hint game-footer-hint" id="tt-hint"></p>
        <div class="tt-footer-actions game-footer-actions game-topbar-group">
            <a class="tt-icon-btn game-icon-btn" data-chrome="home" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            <button type="button" class="tt-icon-btn game-icon-btn" data-chrome="more" aria-expanded="false" aria-controls="ttMoreNav" title="More games" aria-label="More games"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 8.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.2a2.6 2.6 0 0 1-4.7 2L15.6 16H8.4l-1.5 2.4a2.6 2.6 0 0 1-4.7-2l.7-4.2a4.6 4.6 0 0 1 4.5-3.7z"/><path d="M7.5 11.6v3M6 13.1h3"/><circle cx="16.2" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <nav class="more-games game-footer-nav" id="ttMoreNav" hidden></nav>
    </footer>
    </div>

    <!-- 移动端底部抽屉：桌面端由 .game-drawer 整体隐藏，内容区仍用 #statsPanels 搬家 -->
    <div class="game-drawer" id="statsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="statsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="statsDrawerTitle">Stats</span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="statsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="statsDrawerBody"></div>
        </div>
    </div>

    <div class="level-up-effect" id="levelUpEffect"></div>

    <!-- Mobile bottom controls -->
    <div class="mobile-controls" id="mobileControls">
        <button class="btn" id="mobileStartBtn"></button>
        <button class="btn" id="mobilePauseBtn"></button>
        <button class="btn" id="mobileRestartBtn"></button>
    </div>

        <!-- registry:begin seo-script -->
    <script>
        // Generated by `npm run gen` from games.config.json — do not edit by hand.
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) canonical.setAttribute('href', currentUrl);
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-tetris.svg', baseUrl).href;
            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', currentUrl);
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) ogImage.setAttribute('content', socialImage);
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) twitterImage.setAttribute('content', socialImage);
            const gameData = {"@context":"https://schema.org","@type":"VideoGame","name":"Tetris - Cool Edition","url":currentUrl,"description":"Play Tetris - Cool Edition. A modern take on the classic puzzle game with particle effects and smooth animations.","applicationCategory":"GameApplication","operatingSystem":"Web","genre":["Puzzle","Arcade"],"playMode":"SinglePlayer","image":socialImage,"inLanguage":document.documentElement.lang||"en","publisher":{"@type":"Organization","name":"Orangely"}};
            const breadcrumb = {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Mini Games Collection","item":baseUrl},{"@type":"ListItem","position":2,"name":"Tetris - Cool Edition","item":currentUrl}]};
            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
        <!-- registry:end seo-script -->
    <script type="module" src="js/tetris.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
