<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Play Tetris - Cool Edition. A modern take on the classic puzzle game with particle effects and smooth animations.">
    <meta name="keywords" content="tetris, puzzle game, block game, html5 tetris, browser game">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="">
    <meta property="og:title" content="Tetris - Cool Edition">
    <meta property="og:description" content="A modern take on the classic puzzle game with particle effects and smooth animations.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-tetris.svg">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tetris - Cool Edition">
    <meta name="twitter:description" content="Clear lines with smooth controls on desktop and mobile.">
    <meta name="twitter:image" content="assets/seo/og-tetris.svg">
    <title>Tetris - Cool edition</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23667eea'/%3E%3Crect x='14' y='14' width='11' height='11' fill='white'/%3E%3Crect x='26' y='14' width='11' height='11' fill='white' opacity='0.85'/%3E%3Crect x='26' y='26' width='11' height='11' fill='white'/%3E%3Crect x='38' y='26' width='11' height='11' fill='white' opacity='0.7'/%3E%3C/svg%3E">
        <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tetris.css">
    <link rel="stylesheet" href="css/more-games.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="stars" id="stars"></div>

    <div class="theme-toggle" id="themeToggle"></div>
    <button class="lang-toggle" id="langToggle" title="Language" aria-label="Language"></button>
    <button class="home-toggle" id="homeBtn" title="Home" aria-label="Home" onclick="location.href='index.html'"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>

    <div class="game-container">
        <div class="game-board">
            <canvas id="tetris" width="400" height="800"></canvas>
            <canvas id="particleCanvas" width="400" height="800"></canvas>
            <canvas id="lineClearCanvas" width="400" height="800"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-content">
                    <h2 id="gameOverTitle"></h2>
                    <p id="finalScoreLabel"><span id="finalScore">0</span></p>
                    <button class="btn" id="restartBtn"></button>
                </div>
            </div>
            <div class="combo-display" id="comboDisplay"></div>
        </div>

        <div class="info-panel">
            <div class="info-box" style="margin-bottom:8px;">
                <div class="info-row">
                    <span class="info-label" id="usernameLabel"></span>
                    <input id="usernameInput" type="text" maxlength="20" style="flex:1;padding:6px 10px;border-radius:6px;border:1px solid #667eea;background:#222;color:#fff;font-size:15px;" />
                </div>
                <div id="usernameTip" style="font-size:13px;color:#aaa;margin-top:4px;"></div>
            </div>
            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="scoreLabel"></span>
                    <span class="score-display" id="score">0</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="levelLabel"></span>
                    <span class="score-display" id="level">1</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="linesLabel"></span>
                    <span class="score-display" id="lines">0</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row">
                    <span class="info-label" id="comboLabel"></span>
                    <span class="score-display" id="combo">0</span>
                </div>
            </div>

            <div class="info-box">
                <div class="info-row" style="align-items:center;">
                    <span class="info-label" id="nextLabel" style="margin-right:18px;"></span>
                    <canvas id="nextPiece" class="next-piece" width="100" height="100" style="margin:0;"></canvas>
                </div>
            </div>

            <div class="info-box controls">
                <button class="btn" id="startBtn"></button>
                <button class="btn" id="pauseBtn"></button>
                <button class="btn" id="restartGameBtn"></button>
            </div>
            <nav class="more-games">
                <div class="more-games-title">🎮 More Games</div>
                <div class="more-games-links">
              <a href="math-rain.html">🔢 Math Rain</a>
              <a href="tank-battle.html">🎯 Tank Battle</a>
              <a href="gomoku.html">⚫ Gomoku</a>
              <a href="planet-merge.html">🪐 Planet Merge</a>
              <a href="word-daily.html">🔤 Word Daily</a>
              <a href="hoop-shot.html">🏀 Hoop Shot</a>
              <a href="minesweeper.html">💣 Minesweeper</a>
              <a href="reversi.html">⚪ Reversi</a>
              <a href="tower-defense.html">🏰 Neon TD</a>
              <a href="gravity-slingshot.html">🚀 Gravity Slingshot</a>
                </div>
            </nav>
        </div>
    </div>
    
    <div class="global-scores-panel" id="globalScoresPanel">
        <div class="global-scores-header" id="globalScoresHeader">Global Top 5</div>
        <div class="global-scores-list" id="globalScoresList">
            <div class="loading-scores" id="loadingScores">Loading...</div>
        </div>
    </div>

    <div class="level-up-effect" id="levelUpEffect"></div>

    <!-- Mobile bottom controls -->
    <div class="mobile-controls" id="mobileControls">
        <button class="btn" id="mobileStartBtn"></button>
        <button class="btn" id="mobilePauseBtn"></button>
        <button class="btn" id="mobileRestartBtn"></button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) {
                canonical.setAttribute('href', currentUrl);
            }
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-tetris.svg', baseUrl).href;

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', currentUrl);
            }
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) {
                ogImage.setAttribute('content', socialImage);
            }
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) {
                twitterImage.setAttribute('content', socialImage);
            }

            const gameData = {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Tetris - Cool Edition",
                "url": currentUrl,
                "description": "A modern take on the classic puzzle game with particle effects and smooth animations.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Web",
                "genre": ["Puzzle", "Arcade"],
                "playMode": "SinglePlayer",
                "image": socialImage,
                "inLanguage": document.documentElement.lang || "en",
                "publisher": {
                    "@type": "Organization",
                    "name": "Orangely"
                }
            };

            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Mini Games Collection",
                        "item": baseUrl
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Tetris - Cool Edition",
                        "item": currentUrl
                    }
                ]
            };

            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
    <script type="module" src="js/tetris.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
