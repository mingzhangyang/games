<!DOCTYPE html>
<html lang="en" class="game-reset game-hidden-contract">
<head>
    <meta charset="UTF-8">
    <!-- registry:begin head -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-support" content="dark">
    <meta name="theme-color" content="#070b22">
    <script src="/theme-boot.js"></script>
    <meta name="description" content="折光 Lumen — an original beam refraction puzzle. Flip mirrors, bend the beam, light up every crystal. 20 handcrafted levels plus a daily puzzle for the whole world.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="https://games.orangely.xyz/lumen.html">
    <meta property="og:title" content="折光 Lumen — Beam Refraction Puzzle">
    <meta property="og:description" content="Flip mirrors, bend the beam, light every crystal. 20 handcrafted levels and a daily puzzle — light every gem with the fewest flips.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-lumen.svg">
    <meta property="og:url" content="https://games.orangely.xyz/lumen.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="折光 Lumen — Beam Refraction Puzzle">
    <meta name="twitter:description" content="Flip mirrors, bend the beam, light every crystal.">
    <meta name="twitter:image" content="assets/seo/og-lumen.svg">
    <title>Lumen — Beam Refraction Puzzle</title>
    <!-- registry:end head -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070b22'/%3E%3Cpath d='M8 46h32V20' fill='none' stroke='%237dfad0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='32' y1='54' x2='48' y2='38' stroke='%235a7bff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M40 5l8 9-8 9-8-9z' fill='%23f4f7ff'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/lumen.css">
    <link rel="stylesheet" href="css/more-games.css">
</head>
<body>
    <div class="lm-shell game-shell">
        <!-- 顶栏 HUD -->
        <header class="lm-topbar game-topbar">
            <div class="lm-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 src/platform/game-chrome.js 统一写） -->
                <button data-chrome="home" class="lm-icon-btn game-icon-btn" id="lm-btn-home" title="Home" aria-label="Home" data-i18n-title="home" data-i18n-label="home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：关卡 / 翻转数 HUD，各页自由 -->
            <div class="lm-topbar-center game-topbar-center">
                <div class="lm-hud-level" id="lm-hud-level">Level 1/20</div>
                <div class="lm-flip-box">
                    <span class="lm-flip-value" id="lm-flips">0</span>
                    <span class="lm-par game-start-par" id="lm-par">· Par 2</span>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → sound → lang -->
            <div class="lm-topbar-actions game-topbar-group">
                <button type="button" data-contextual-restart="retry" class="lm-icon-btn game-icon-btn hidden" id="lm-reset-btn" title="Reset" aria-label="Reset"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg></button>
                <button data-chrome="stats" type="button" class="lm-icon-btn game-icon-btn lm-stats-btn game-stats-btn" id="lmStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="lmStatsDrawer"></button>
                <button type="button" class="lm-icon-btn game-icon-btn" id="lm-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>

        <!-- 舞台 -->
        <main class="lm-main game-main">
        <div class="lm-stage game-stage" id="lm-stage">
            <canvas class="game-canvas" id="lm-canvas" width="560" height="560"></canvas>

            <!-- 提示 -->
            <div class="lm-toast hidden game-toast" id="lm-toast"></div>

            <!-- 开始界面 -->
            <div class="lm-overlay game-overlay game-overlay--menu" id="lm-start">
                <h1 class="lm-title game-start-title" id="lm-title" data-i18n="title">Lumen</h1>
                <p class="lm-subtitle game-start-subtitle" id="lm-subtitle" data-i18n="subtitle">Flip · Reflect · Light</p>
                <div class="lm-hero">💎</div>
                <p class="lm-howto game-start-howto" id="lm-howto" data-i18n="howto"></p>
                <div class="lm-mode-row game-start-mode-row">
                    <button class="lm-mode game-start-mode" id="lm-btn-levels" data-i18n="playLevels">🧩 Levels</button>
                    <button class="lm-mode lm-mode-daily game-start-mode game-start-mode--daily" id="lm-btn-daily" data-i18n="playDaily">📅 Daily</button>
                </div>
                <p class="lm-level-label game-start-level-label" id="lm-level-label" data-i18n="levelSelect">Select level</p>
                <div class="lm-level-grid game-start-level-grid" id="lm-level-grid"></div>
                <p class="lm-daily-best game-start-daily-best" id="lm-daily-best"></p>
                <div class="lm-start-footer game-start-footer">
                    <button class="lm-icon-btn game-icon-btn" id="lm-start-mute" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                </div>
            </div>

            <!-- 过关面板 -->
            <div class="lm-overlay lm-overlay-dim hidden game-overlay" id="lm-clear">
                <div class="lm-card">
                    <h2 class="lm-card-title game-clear-title" id="lm-clear-stars">⭐⭐⭐</h2>
                    <div class="lm-card-line game-start-card-line" id="lm-clear-line">Flips 0 · Par 0</div>
                    <div class="lm-btn-row game-action-row">
                        <button class="lm-btn lm-btn-primary game-btn game-action-btn game-action-btn--primary" id="lm-btn-next"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h14.5"/><path d="M12.5 6l6 6-6 6"/></svg><span>Next</span></button>
                        <button class="lm-btn game-btn game-action-btn" id="lm-btn-replay"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Retry</span></button>
                        <button class="lm-btn lm-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="lm-btn-menu1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                    </div>
                </div>
            </div>

            <!-- 每日结算 -->
            <div class="lm-overlay hidden game-overlay" id="lm-over">
                <h2 class="lm-overlay-title" id="lm-over-title">Daily complete!</h2>
                <div class="lm-over-score game-over-score" id="lm-over-score">0</div>
                <div class="lm-over-sub game-over-sub" id="lm-over-sub"></div>
                <div class="lm-btn-row game-action-row">
                    <button class="lm-btn game-btn game-action-btn" id="lm-btn-copy"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button>
                    <button class="lm-btn lm-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="lm-btn-menu2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                </div>
                <div class="lm-lb game-lb">
                    <div class="lm-lb-title game-lb-title" id="lm-lb-title">🏆 Global · Today's Puzzle</div>
                    <div class="lm-lb-list game-lb-list" id="lm-lb-list"></div>
                    <div class="lm-lb-status game-lb-status" id="lm-lb-status"></div>
                    <div class="lm-username-row game-lb-username-row">
                        <label class="lm-username-label game-lb-username-label" for="lm-username" id="lm-username-label" data-i18n="usernameLabel">Username</label>
                        <input class="lm-username game-lb-username" id="lm-username" maxlength="20" autocomplete="off" data-i18n-placeholder="usernameLabel">
                    </div>
                </div>
                <button class="lm-btn lm-btn-primary game-btn game-action-btn game-action-btn--primary" id="lm-btn-again"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Again</span></button>
            </div>
        </div>

            <aside class="lm-sidebar game-sidebar">

            <!-- 由 game-drawer.js 在侧栏 / 底部抽屉之间搬移的面板容器 -->
            <div id="lmStatsPanels">
                <div class="lm-side-card game-side-card">
                    <div class="lm-side-title game-side-title" id="lm-side-howto-title"></div>
                    <p class="lm-side-text game-side-text" id="lm-side-howto" data-i18n="howto"></p>
                </div>
                <div class="lm-side-card game-side-card">
                    <div class="lm-side-title game-side-title" id="lm-side-records-title"></div>
                    <div class="lm-side-records game-side-records" id="lm-side-records"></div>
                </div>
            </div>

            <!-- 桌面侧栏专属：必须放在 #lmStatsPanels 外面 —— 那个节点会被
                 src/platform/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <div class="lm-side-card game-side-card">
                <nav class="more-games" id="lmSideMore"></nav>
            </div>

        </aside>
    </main>



    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只保留操作提示；导航与状态控件统一留在 header / 页面主体。 -->
    <footer class="lm-footer game-footer">
        <p class="lm-footer-hint game-footer-hint" id="lm-hint" data-i18n="hint"></p>
    </footer>
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <div class="game-drawer" id="lmStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="lmStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="lmStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="lmStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="lmStatsDrawerBody"></div>
        </div>
    </div>


        <!-- registry:begin seo-script -->
    <script>
        // Generated by `npm run gen` from games.config.json — do not edit by hand.
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) canonical.setAttribute('href', currentUrl);
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-lumen.svg', baseUrl).href;
            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', currentUrl);
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) ogImage.setAttribute('content', socialImage);
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) twitterImage.setAttribute('content', socialImage);
            const gameData = {"@context":"https://schema.org","@type":"VideoGame","name":"折光 Lumen — Beam Refraction Puzzle","url":currentUrl,"description":"折光 Lumen — an original beam refraction puzzle. Flip mirrors, bend the beam, light up every crystal. 20 handcrafted levels plus a daily puzzle for the whole world.","applicationCategory":"GameApplication","operatingSystem":"Web","genre":["PuzzleGame","CasualGame"],"playMode":"SinglePlayer","image":socialImage,"inLanguage":document.documentElement.lang||"en","publisher":{"@type":"Organization","name":"Orangely"}};
            const breadcrumb = {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Mini Games Collection","item":baseUrl},{"@type":"ListItem","position":2,"name":"折光 Lumen — Beam Refraction Puzzle","item":currentUrl}]};
            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
        <!-- registry:end seo-script -->
    <script type="module" src="js/lumen.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
