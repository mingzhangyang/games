<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found - Mini Games Collection</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23667eea'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-size='32' fill='white' font-family='Segoe UI,Arial' dy='.3em'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }
        .code { font-size: 5em; margin: 0; opacity: 0.9; }
        h1 { font-size: 1.4em; margin: 12px 0 8px; }
        p { color: #94a3b8; margin: 0 0 28px; }
        a {
            color: #fff;
            background: #6366f1;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
        }
        a:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <p class="code">🎮 404</p>
    <h1 id="error-title">Page not found</h1>
    <p id="error-desc">The game you are looking for doesn't exist or has moved.</p>
    <a href="/" id="error-home">Back to Games</a>
    <script>
        try {
            const lang = localStorage.getItem('site_lang') || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
            if (lang === 'zh') {
                document.documentElement.lang = 'zh';
                document.title = '页面未找到 - 经典小游戏合集';
                document.getElementById('error-title').textContent = '页面未找到';
                document.getElementById('error-desc').textContent = '你访问的游戏页面不存在或已被移动。';
                document.getElementById('error-home').textContent = '返回游戏大厅';
            }
        } catch (e) {}
    </script>
</body>
</html>
