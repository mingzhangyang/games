<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="pm-title pm-desc">
  <title id="pm-title">Planet Merge social card</title>
  <desc id="pm-desc">Social preview image for the Planet Merge web game — drop planets, merge them, forge a sun.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f24"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#f7c948" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f7c948" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earthBall" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="0.55" stop-color="#3f8fd2"/>
      <stop offset="1" stop-color="#1c4e7e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 星星 -->
  <g fill="#dfe7ff">
    <circle cx="120" cy="90" r="2" opacity="0.7"/>
    <circle cx="310" cy="55" r="1.4" opacity="0.5"/>
    <circle cx="540" cy="110" r="1.8" opacity="0.6"/>
    <circle cx="760" cy="60" r="1.2" opacity="0.45"/>
    <circle cx="980" cy="100" r="2.2" opacity="0.7"/>
    <circle cx="1110" cy="180" r="1.5" opacity="0.5"/>
    <circle cx="80" cy="420" r="1.6" opacity="0.5"/>
    <circle cx="200" cy="560" r="1.3" opacity="0.4"/>
    <circle cx="620" cy="590" r="1.8" opacity="0.55"/>
    <circle cx="900" cy="560" r="1.4" opacity="0.45"/>
    <circle cx="1120" cy="480" r="1.9" opacity="0.6"/>
    <circle cx="420" cy="40" r="1.2" opacity="0.4"/>
    <circle cx="1010" cy="300" r="1.3" opacity="0.4"/>
  </g>

  <rect x="48" y="48" width="1104" height="534" rx="26" fill="rgba(0,0,0,0.30)" stroke="#818cf8" stroke-width="2.5"/>

  <!-- 星球链 -->
  <g text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">
    <circle cx="215" cy="470" r="118" fill="url(#sunGlow)"/>
    <text x="215" y="470" font-size="64" dominant-baseline="central" transform="translate(0,4)">🪨</text>
    <text x="330" y="470" font-size="72" dominant-baseline="central" transform="translate(0,4)">🌙</text>
    <text x="445" y="470" font-size="82" dominant-baseline="central" transform="translate(0,4)">🔴</text>
    <text x="570" y="470" font-size="92" dominant-baseline="central" transform="translate(0,4)">🌏</text>
    <text x="710" y="470" font-size="104" dominant-baseline="central" transform="translate(0,4)">🪐</text>
    <text x="880" y="470" font-size="128" dominant-baseline="central" transform="translate(0,4)">☀️</text>
    <text x="1040" y="470" font-size="120" dominant-baseline="central" transform="translate(0,4)">✨</text>
  </g>

  <!-- 标题区 -->
  <text x="88" y="175" fill="#f4f6ff" font-size="86" font-weight="800" font-family="Segoe UI, system-ui, sans-serif">Planet Merge</text>
  <text x="88" y="235" fill="#aab6ea" font-size="34" font-family="Segoe UI, system-ui, sans-serif">Drop · Merge · Chain the cosmos</text>
  <text x="88" y="300" fill="#8fa0d8" font-size="27" font-family="Segoe UI, system-ui, sans-serif">Merge identical planets, forge a sun, chase combo high scores.</text>
  <text x="88" y="345" fill="#8fa0d8" font-size="27" font-family="Segoe UI, system-ui, sans-serif">Daily challenge — everyone plays the same sequence.</text>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="88" y="378" rx="24" width="300" height="48" fill="rgba(99,102,241,0.35)"/>
    <text x="238" y="409" fill="#e0e7ff" font-size="26" font-weight="600" text-anchor="middle">🎮 Play in browser</text>
  </g>
</svg>
