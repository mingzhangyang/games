<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">Minesweeper social card</title>
  <desc id="ms-desc">Social preview for Minesweeper 扫雷 — classic logic puzzle.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f24"/>
      <stop offset="0.6" stop-color="#12193c"/>
      <stop offset="1" stop-color="#0e2030"/>
    </linearGradient>
    <radialGradient id="cellGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3d4778"/>
      <stop offset="1" stop-color="#232b52"/>
    </radialGradient>
    <radialGradient id="mineGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d5e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#dfe7ff">
    <circle cx="170" cy="90" r="2" opacity="0.55"/>
    <circle cx="450" cy="60" r="1.5" opacity="0.45"/>
    <circle cx="720" cy="100" r="1.8" opacity="0.5"/>
    <circle cx="980" cy="70" r="1.4" opacity="0.45"/>
    <circle cx="1110" cy="200" r="2" opacity="0.55"/>
    <circle cx="110" cy="500" r="1.6" opacity="0.5"/>
  </g>

  <rect x="48" y="48" width="1104" height="534" rx="26" fill="rgba(0,0,0,0.30)" stroke="#40b8ff" stroke-width="2.5"/>

  <text x="88" y="185" fill="#f4f6ff" font-size="88" font-weight="800" font-family="Segoe UI, system-ui, sans-serif">Minesweeper</text>
  <text x="88" y="250" fill="#40d8ff" font-size="40" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif">扫雷 · 经典逻辑推理</text>
  <text x="88" y="312" fill="#8fa0d8" font-size="28" font-family="Segoe UI, system-ui, sans-serif">Safe first click · chording · three difficulties.</text>
  <text x="88" y="356" fill="#8fa0d8" font-size="28" font-family="Segoe UI, system-ui, sans-serif">Clear the board without detonating a single mine.</text>

  <!-- 小棋盘 -->
  <g transform="translate(830 240)">
    <rect x="0" y="0" width="270" height="180" rx="14" fill="rgba(0,0,0,0.35)" stroke="rgba(64,184,255,0.4)" stroke-width="2"/>
    <g>
      <rect x="18" y="18" width="46" height="46" rx="10" fill="url(#cellGrad)"/>
      <rect x="74" y="18" width="46" height="46" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="97" y="51" fill="#58a6ff" font-size="30" font-weight="800" text-anchor="middle" font-family="Segoe UI, sans-serif">1</text>
      <rect x="130" y="18" width="46" height="46" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="153" y="51" fill="#3fd97c" font-size="30" font-weight="800" text-anchor="middle" font-family="Segoe UI, sans-serif">2</text>
      <rect x="186" y="18" width="46" height="46" rx="10" fill="url(#cellGrad)"/>
      <circle cx="209" cy="41" r="11" fill="#e8ecff"/>

      <rect x="18" y="74" width="46" height="46" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="41" y="107" fill="#ff6b7a" font-size="30" font-weight="800" text-anchor="middle" font-family="Segoe UI, sans-serif">3</text>
      <rect x="74" y="74" width="46" height="46" rx="10" fill="url(#mineGlow)"/>
      <circle cx="97" cy="97" r="14" fill="#e8ecff"/>
      <circle cx="97" cy="97" r="8" fill="#40b8ff"/>
      <circle cx="97" cy="97" r="3.5" fill="#ff4d5e"/>
      <path d="M97 78v-6M97 116v6M78 97h-6M116 97h6" stroke="#e8ecff" stroke-width="3.4" stroke-linecap="round"/>
      <rect x="130" y="74" width="46" height="46" rx="10" fill="url(#cellGrad)"/>
      <text x="153" y="106" font-size="26" text-anchor="middle">🚩</text>
      <rect x="186" y="74" width="46" height="46" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="209" y="107" fill="#b48cff" font-size="30" font-weight="800" text-anchor="middle" font-family="Segoe UI, sans-serif">4</text>

      <rect x="18" y="130" width="46" height="46" rx="10" fill="url(#cellGrad)"/>
      <rect x="74" y="130" width="46" height="46" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="97" y="163" fill="#2dd4d4" font-size="30" font-weight="800" text-anchor="middle" font-family="Segoe UI, sans-serif">6</text>
      <rect x="130" y="130" width="46" height="46" rx="10" fill="url(#cellGrad)"/>
      <rect x="186" y="130" width="46" height="46" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="209" y="163" fill="#ffb454" font-size="30" font-weight="800" text-anchor="middle" font-family="Segoe UI, sans-serif">5</text>
    </g>
  </g>

  <text x="88" y="552" fill="#e0e7ff" font-size="27" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">💣 Play in browser · minesweeper</text>
</svg>
