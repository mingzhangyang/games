                    </div>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → pause → sound → lang -->

        </header>

        <!-- 状态行 -->
        <div class="rv-status" id="rv-status">Your turn</div>

        <!-- 棋盘 -->
        <div class="rv-stage game-stage">
            <div class="rv-board" id="rv-board" role="grid" aria-label="Reversi board"></div>

            <!-- 过路提示 -->

            <!-- 开始界面 -->
