<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Gomoku (Five in a Row) online. Challenge the AI or play with a friend in this classic strategy board game.">
    <meta name="keywords" content="gomoku, five in a row, board game, strategy game, ai game, two player game">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="https://games.orangely.xyz/gomoku.html">
    <meta property="og:title" content="Gomoku - Five in a Row">
    <meta property="og:description" content="Challenge the AI or play with a friend in this classic strategy board game.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-gomoku.svg">
    <meta property="og:url" content="https://games.orangely.xyz/gomoku.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gomoku - Five in a Row">
    <meta name="twitter:description" content="Online Five in a Row with adaptive AI and two-player mode.">
    <meta name="twitter:image" content="assets/seo/og-gomoku.svg">
    <title>Gomoku - Five in a Row</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23fff'/%3E%3C/svg%3E">
        <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/gomoku.css">
    <link rel="stylesheet" href="css/more-games.css">
</head>
<body>
    <div class="game-container game-shell">
        <header class="gomoku-top-row game-topbar">
            <div class="gm-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 js/game-chrome.js 统一写） -->
                <a data-chrome="home" href="index.html" id="homeLink" class="icon-btn game-icon-btn" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            </div>
            <!-- 中槽：标题 / HUD，各页自由 -->
            <div class="gm-topbar-center game-topbar-center">
                <h1 id="gameTitle" class="gomoku-title game-title-pill">Gomoku</h1>
            </div>
            <!-- 右簇固定顺序：专属 → stats → pause → sound → lang -->
            <div class="gm-topbar-actions game-topbar-group">
                <button type="button" class="gm-icon-btn game-icon-btn" id="gm-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                <button data-chrome="lang" id="langBtn" class="game-icon-btn" title="Language" aria-label="Language">中文</button>
            </div>
        </header>

        <div class="status-bar">
            <div class="status-item" id="statusText">Black's Turn</div>
            <div class="status-item" id="modeText"></div>
        </div>

        <div class="board-container game-stage">
            <canvas id="gameBoard"></canvas>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="restartBtn">Restart Game</button>
            <button class="btn btn-ghost" id="modeBtn">Mode: vs Computer</button>
            <select id="difficultySelect" class="btn btn-ghost gomoku-select">
                <option value="easy" id="optEasy">Easy</option>
                <option value="medium" id="optMedium" selected>Medium</option>
                <option value="hard" id="optHard">Hard</option>
            </select>
        </div>


    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只放无状态导航；Sound / Lang 是状态开关，唯一真源在 header。 -->
    <footer class="gm-footer game-footer">
        <p class="gm-footer-hint game-footer-hint" id="gm-hint"></p>
        <div class="gm-footer-actions game-footer-actions game-topbar-group">
            <a class="gm-icon-btn game-icon-btn" data-chrome="home" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            <button type="button" class="gm-icon-btn game-icon-btn" data-chrome="more" aria-expanded="false" aria-controls="gmMoreNav" title="More games" aria-label="More games"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 8.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.2a2.6 2.6 0 0 1-4.7 2L15.6 16H8.4l-1.5 2.4a2.6 2.6 0 0 1-4.7-2l.7-4.2a4.6 4.6 0 0 1 4.5-3.7z"/><path d="M7.5 11.6v3M6 13.1h3"/><circle cx="16.2" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <nav class="more-games game-footer-nav" id="gmMoreNav" hidden></nav>
    </footer>
    </div>
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 id="modalTitle">Game Over</h2>
            <p id="modalMessage"></p>
            <button class="btn btn-primary" id="modalRestartBtn">Play Again</button>
            <button class="btn btn-ghost" id="modalViewBtn">View Board</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) {
                canonical.setAttribute('href', currentUrl);
            }
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-gomoku.svg', baseUrl).href;

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', currentUrl);
            }
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) {
                ogImage.setAttribute('content', socialImage);
            }
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) {
                twitterImage.setAttribute('content', socialImage);
            }

            const gameData = {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Gomoku",
                "url": currentUrl,
                "description": "Challenge the AI or play with a friend in this classic strategy board game.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Web",
                "genre": ["BoardGame", "Strategy"],
                "playMode": ["SinglePlayer", "MultiPlayer"],
                "image": socialImage,
                "inLanguage": document.documentElement.lang || "en",
                "publisher": {
                    "@type": "Organization",
                    "name": "Orangely"
                }
            };

            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Mini Games Collection",
                        "item": baseUrl
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Gomoku",
                        "item": currentUrl
                    }
                ]
            };

            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
    <script type="module" src="js/gomoku.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
