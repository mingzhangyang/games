<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0e24">
    <meta name="description" content="Gravity Slingshot 引力弹弓 — an original orbital physics game. Pull back the slingshot, bend your path around planets and capture the wormhole. 20 holes plus a daily course for the whole world.">
    <meta name="keywords" content="gravity game, orbital physics, slingshot game, space puzzle, daily challenge, 引力弹弓, 轨道游戏, 太空弹弓">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="https://games.orangely.xyz/gravity-slingshot.html">
    <meta property="og:title" content="Gravity Slingshot 引力弹弓 — Orbital Physics Puzzle">
    <meta property="og:description" content="Pull back the slingshot, bend around planets, capture the wormhole. 20 handcrafted holes and a daily course — fewer launches, more stars.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-gravity-slingshot.svg">
    <meta property="og:url" content="https://games.orangely.xyz/gravity-slingshot.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gravity Slingshot 引力弹弓 — Orbital Physics Puzzle">
    <meta name="twitter:description" content="Bend your path around planets and capture the wormhole.">
    <meta name="twitter:image" content="assets/seo/og-gravity-slingshot.svg">
    <title>Gravity Slingshot — Orbital Physics Puzzle</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0e24'/%3E%3Ccircle cx='40' cy='38' r='14' fill='%232a3c8f'/%3E%3Ccircle cx='40' cy='38' r='14' fill='none' stroke='%235a7bff' stroke-width='2'/%3E%3Cellipse cx='40' cy='38' rx='26' ry='10' fill='none' stroke='%237dfad0' stroke-width='2' transform='rotate(-24 40 38)'/%3E%3Ccircle cx='17' cy='29' r='3.4' fill='%23f4f7ff'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/gravity.css">
    <link rel="stylesheet" href="css/more-games.css">
</head>
<body>
    <div class="gd-shell game-shell">
        <!-- 顶栏 HUD -->
        <header class="gd-topbar game-topbar">
            <div class="gd-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 js/game-chrome.js 统一写） -->
                <button data-chrome="home" class="gd-icon-btn game-icon-btn" id="gd-btn-home" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：标题 / HUD，各页自由 -->
            <div class="gd-topbar-center game-topbar-center">
                <div class="gd-hole-label" id="gd-hole-label">Hole 1/20</div>
                <div class="gd-launch-box">
                    <span class="gd-launch-value" id="gd-launches">0</span>
                    <span class="gd-par" id="gd-par">· Par 1</span>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → pause → sound → lang -->
            <div class="gd-topbar-actions game-topbar-group">
                <button class="gd-icon-btn game-icon-btn" id="gd-reset-btn" title="Retry" aria-label="Retry"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg></button>
                <button data-chrome="stats" type="button" class="gd-icon-btn game-icon-btn gd-stats-btn game-stats-btn" id="gdStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="gdStatsDrawer"></button>
                <button type="button" class="gd-icon-btn game-icon-btn" id="gd-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                <button type="button" class="gd-icon-btn gd-lang-btn game-icon-btn game-icon-btn--wide" id="gd-btn-lang-ui" data-chrome="lang" title="Language" aria-label="Language">中文</button>
            </div>
        </header>

        <!-- 星区总览 -->
        <div class="gd-main game-main">
        <div class="gd-stage game-stage" id="gd-stage">
            <canvas class="game-canvas" id="gd-canvas" width="480" height="640"></canvas>

            <!-- 提示 -->
            <div class="gd-toast hidden game-toast" id="gd-toast"></div>

            <!-- 开始界面 -->
            <div class="gd-overlay game-overlay" id="gd-start">
                <h1 class="gd-title" id="gd-title">Gravity Slingshot</h1>
                <p class="gd-subtitle" id="gd-subtitle">Aim · Bend · Orbit · Capture</p>
                <div class="gd-hero">🚀</div>
                <p class="gd-howto" id="gd-howto"></p>
                <div class="gd-mode-row">
                    <button class="gd-mode" id="gd-btn-levels">🛰 Levels</button>
                    <button class="gd-mode gd-mode-daily" id="gd-btn-daily">📅 Daily Course</button>
                </div>
                <p class="gd-level-label" id="gd-level-label">Select hole</p>
                <div class="gd-level-grid" id="gd-level-grid"></div>
                <p class="gd-daily-best" id="gd-daily-best"></p>
                <div class="gd-start-footer">
                    <button class="gd-icon-btn game-icon-btn" id="gd-start-mute" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                    <button class="gd-icon-btn gd-lang-btn game-icon-btn" id="gd-start-lang">中文</button>
                </div>
            </div>

            <!-- 过关面板 -->
            <div class="gd-overlay gd-overlay-dim hidden game-overlay" id="gd-hole">
                <div class="gd-card">
                    <h2 class="gd-card-title" id="gd-hole-stars">⭐⭐⭐</h2>
                    <div class="gd-card-line" id="gd-hole-line">Launches 1 · Par 1</div>
                    <div class="gd-btn-row">
                        <button class="gd-btn gd-btn-primary" id="gd-btn-next">Next ▶</button>
                        <button class="gd-btn game-btn" id="gd-btn-replay"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Retry</span></button>
                        <button class="gd-btn gd-btn-ghost game-btn" id="gd-btn-menu1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                    </div>
                </div>
            </div>

            <!-- 每日结算 -->
            <div class="gd-overlay hidden game-overlay" id="gd-over">
                <h2 class="gd-overlay-title" id="gd-over-title">Daily complete!</h2>
                <div class="gd-over-score" id="gd-over-score">7</div>
                <div class="gd-over-sub" id="gd-over-sub"></div>
                <div class="gd-btn-row">
                    <button class="gd-btn game-btn" id="gd-btn-copy"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button>
                    <button class="gd-btn gd-btn-ghost game-btn" id="gd-btn-menu2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                </div>
                <div class="gd-lb">
                    <div class="gd-lb-title" id="gd-lb-title">🏆 Global · Today's Course</div>
                    <div class="gd-lb-list" id="gd-lb-list"></div>
                    <div class="gd-lb-status" id="gd-lb-status"></div>
                    <div class="gd-username-row">
                        <label class="gd-username-label" for="gd-username" id="gd-username-label">Username</label>
                        <input class="gd-username" id="gd-username" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <button class="gd-btn gd-btn-primary game-btn" id="gd-btn-again"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Again</span></button>
            </div>
        </div>

            <aside class="gd-sidebar game-sidebar">

            <!-- 由 apply-stats-drawer.py 生成的搬迁节点：JS 在侧栏 / 底部抽屉之间搬移它 -->
            <div id="gdStatsPanels">
                <div class="gd-side-card game-side-card">
                    <div class="gd-side-title game-side-title" id="gd-side-howto-title"></div>
                    <p class="gd-side-text game-side-text" id="gd-side-howto"></p>
                </div>
                <div class="gd-side-card game-side-card">
                    <div class="gd-side-title game-side-title" id="gd-side-records-title"></div>
                    <div class="gd-side-records" id="gd-side-records"></div>
                </div>
            </div>

            <!-- 桌面侧栏专属：必须放在 #gdStatsPanels 外面 —— 那个节点会被
                 js/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <div class="gd-side-card game-side-card">
                <nav class="more-games" id="gdSideMore"></nav>
            </div>

        </aside>
    </div>

    

    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只放无状态导航；Sound / Lang 是状态开关，唯一真源在 header。 -->
    <footer class="gd-footer game-footer">
        <p class="gd-footer-hint game-footer-hint" id="gd-hint"></p>
        <div class="gd-footer-actions game-footer-actions game-topbar-group">
            <a class="gd-icon-btn game-icon-btn" data-chrome="home" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            <button type="button" class="gd-icon-btn game-icon-btn" data-chrome="more" aria-expanded="false" aria-controls="gdMoreNav" title="More games" aria-label="More games"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 8.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.2a2.6 2.6 0 0 1-4.7 2L15.6 16H8.4l-1.5 2.4a2.6 2.6 0 0 1-4.7-2l.7-4.2a4.6 4.6 0 0 1 4.5-3.7z"/><path d="M7.5 11.6v3M6 13.1h3"/><circle cx="16.2" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <nav class="more-games game-footer-nav" id="gdMoreNav" hidden></nav>
    </footer>
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <div class="game-drawer" id="gdStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="gdStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="gdStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="gdStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="gdStatsDrawerBody"></div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) {
                canonical.setAttribute('href', currentUrl);
            }
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-gravity-slingshot.svg', baseUrl).href;

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', currentUrl);
            }
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) {
                ogImage.setAttribute('content', socialImage);
            }
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) {
                twitterImage.setAttribute('content', socialImage);
            }

            const gameData = {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Gravity Slingshot 引力弹弓",
                "url": currentUrl,
                "description": "Original orbital physics puzzle — slingshot your probe around planets into the wormhole. 20 handcrafted holes plus a daily course with a global leaderboard.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Web",
                "genre": ["PuzzleGame", "SimulationGame"],
                "playMode": "SinglePlayer",
                "image": socialImage,
                "inLanguage": document.documentElement.lang || "en",
                "publisher": {
                    "@type": "Organization",
                    "name": "Orangely"
                }
            };

            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Mini Games Collection",
                        "item": baseUrl
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Gravity Slingshot",
                        "item": currentUrl
                    }
                ]
            };

            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
    <script type="module" src="js/gravity-slingshot.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
