<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- registry:begin head -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a2f1a">
    <meta name="description" content="Play Tank Battle, a classic retro arcade tank game in your browser. Defend your base and destroy enemy tanks.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="https://games.orangely.xyz/tank-battle.html">
    <meta property="og:title" content="Tank Battle - Retro Arcade">
    <meta property="og:description" content="Protect your base, switch weapons, and survive waves of enemy tanks.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-tank-battle.svg">
    <meta property="og:url" content="https://games.orangely.xyz/tank-battle.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tank Battle - Retro Arcade">
    <meta name="twitter:description" content="Classic browser tank shooter with keyboard controls and power-ups.">
    <meta name="twitter:image" content="assets/seo/og-tank-battle.svg">
    <title>Tank Battle - Retro Arcade</title>
    <!-- registry:end head -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310b981'/%3E%3Crect x='16' y='30' width='32' height='18' rx='5' fill='%23064e3b'/%3E%3Crect x='27' y='16' width='10' height='16' rx='2' fill='%23064e3b'/%3E%3Crect x='35' y='18' width='18' height='5' rx='2.5' fill='%23064e3b'/%3E%3Ccircle cx='32' cy='39' r='6' fill='%23a7f3d0'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/tank-battle.css">
</head>
<body>
    <!-- P4-2 最小接骨架：main 语义 + sr-only h1（横屏掌机形态保持覆盖式 HUD，不套竖屏 topbar/sidebar） -->
    <main class="tb-main">
        <h1 class="sr-only">Tank Battle - 坦克大战</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameUI">
            <button class="icon-btn tb-home-btn" onclick="location.href='index.html'" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            <div id="gameInfo">
                <div><svg class="tb-hud-ico" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 20.3l-1.45-1.32C5.4 14.24 2 11.24 2 7.64 2 5.06 4 3 6.5 3c1.74 0 3.41.94 4.3 2.38C12.09 3.94 13.76 3 15.5 3 18 3 20 5.06 20 7.64c0 3.6-3.4 6.6-8.55 11.34z"/></svg> <span id="livesLabel">生命</span>: <span id="lives">3</span></div>
                <div><svg class="tb-hud-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0V4z"/><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3"/><path d="M10 13h4M9 20h6M12 13v7"/></svg> <span id="scoreLabel">分数</span>: <span id="score">0</span></div>
                <div><svg class="tb-hud-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="11" width="3.5" height="9" rx="1"/><rect x="10" y="5" width="3.5" height="15" rx="1"/><rect x="16" y="8" width="3.5" height="12" rx="1"/></svg> <span id="levelLabel">关卡</span>: <span id="level">1</span></div>
                <div><svg class="tb-hud-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg> <span id="enemiesLabel">敌人</span>: <span id="enemies">0</span></div>
            </div>
            <canvas id="miniMap" width="120" height="90"></canvas>
            <div id="controls">
                <span id="controlsText">WASD: 移动 | 空格: 射击 | P: 暂停<br>1-3: 切换武器 | R: 重新开始 | L: 切换语言</span>
            </div>
            <div id="weaponInfo">
                <svg class="tb-hud-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h11l3 3h3v3h-5l-2 3H9l-1-3H3z"/></svg> <span id="weaponLabel">武器</span>: <span id="currentWeapon">普通弹</span><br>
                <svg class="tb-hud-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg> <span id="ammoLabel">弹药</span>: <span id="ammo">∞</span>
            </div>
        </div>
    </div>

    <!-- 移动端虚拟控制器 (横屏掌机手柄) -->
    <div id="virtualController" class="virtual-controller" aria-hidden="true">
        <!-- 左侧十字方向键 (D-Pad) -->
        <div id="dpad" class="v-dpad">
            <div class="dpad-cross">
                <button type="button" class="dpad-btn dpad-up" data-dir="w" aria-label="Up">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                </button>
                <button type="button" class="dpad-btn dpad-left" data-dir="a" aria-label="Left">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 12l8-8v6h8v4h-8v6z"/></svg>
                </button>
                <div class="dpad-center"></div>
                <button type="button" class="dpad-btn dpad-right" data-dir="d" aria-label="Right">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
                </button>
                <button type="button" class="dpad-btn dpad-down" data-dir="s" aria-label="Down">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
                </button>
            </div>
        </div>

        <!-- 右侧动作按键区 -->
        <div id="actionButtons" class="v-actions">
            <div class="v-aux-row">
                <button type="button" id="btnPause" class="v-aux-btn" aria-label="Pause" title="暂停/继续">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
                </button>
                <button type="button" id="btnWeapon" class="v-weapon-btn" aria-label="Switch Weapon" title="切换武器">
                    <span class="v-weapon-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h11l3 3h3v3h-5l-2 3H9l-1-3H3z"/></svg></span>
                    <span class="v-weapon-badge" id="vWeaponBadge">1</span>
                </button>
            </div>
            <button type="button" id="btnFire" class="v-fire-btn" aria-label="Fire">
                <span class="v-fire-label" id="vFireLabel">FIRE</span>
            </button>
        </div>
    </div>

    <!-- 移动端竖屏旋转提示浮层 -->
    <div id="orientationOverlay" class="orientation-overlay" aria-live="polite">
        <div class="orientation-modal">
            <div class="rotate-device-anim">
                <div class="phone-frame">
                    <div class="phone-screen"></div>
                </div>
                <div class="rotate-curve-arrow">
                    <svg viewBox="0 0 36 36" width="38" height="38" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"><path d="M28 14 A 12 12 0 0 0 8 18"/><polyline points="28,8 28,14 22,14"/></svg>
                </div>
            </div>
            <h2 id="orientTitle">请旋转手机横屏游玩</h2>
            <p id="orientSub">专为横屏掌机体验深度优化</p>
            <p class="orient-en" id="orientEn">Rotate to landscape for arcade controls</p>
            <button type="button" class="orient-back-btn" onclick="location.href='index.html'">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg>
                <span id="orientHomeText">返回游戏大厅</span>
            </button>
        </div>
    </div>
    </main>

        <!-- registry:begin seo-script -->
    <script>
        // Generated by `npm run gen` from games.config.json — do not edit by hand.
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) canonical.setAttribute('href', currentUrl);

            const socialImage = new URL('assets/seo/og-tank-battle.svg', baseUrl).href;
            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', currentUrl);
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) ogImage.setAttribute('content', socialImage);
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) twitterImage.setAttribute('content', socialImage);
            const gameData = {"@context":"https://schema.org","@type":"VideoGame","name":"Tank Battle - Retro Arcade","url":currentUrl,"description":"Play Tank Battle, a classic retro arcade tank game in your browser. Defend your base and destroy enemy tanks.","applicationCategory":"GameApplication","operatingSystem":"Web","genre":["Arcade","Shooter","Retro"],"playMode":"SinglePlayer","image":socialImage,"inLanguage":document.documentElement.lang||"en","publisher":{"@type":"Organization","name":"Orangely"}};
            const breadcrumb = {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Mini Games Collection","item":baseUrl},{"@type":"ListItem","position":2,"name":"Tank Battle - Retro Arcade","item":currentUrl}]};
            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
        <!-- registry:end seo-script -->
    <script type="module" src="js/tank-battle.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
