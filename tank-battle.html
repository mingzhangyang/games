<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Tank Battle, a classic retro arcade tank game in your browser. Defend your base and destroy enemy tanks.">
    <meta name="keywords" content="tank battle, tank game, arcade game, retro game, html5 game">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="">
    <meta property="og:title" content="Tank Battle - Retro Arcade">
    <meta property="og:description" content="Protect your base, switch weapons, and survive waves of enemy tanks.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-tank-battle.svg">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tank Battle - Retro Arcade">
    <meta name="twitter:description" content="Classic browser tank shooter with keyboard controls and power-ups.">
    <meta name="twitter:image" content="assets/seo/og-tank-battle.svg">
    <title>坦克大战 - Tank Battle Enhanced</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310b981'/%3E%3Crect x='16' y='30' width='32' height='18' rx='5' fill='%23064e3b'/%3E%3Crect x='27' y='16' width='10' height='16' rx='2' fill='%23064e3b'/%3E%3Crect x='35' y='18' width='18' height='5' rx='2.5' fill='%23064e3b'/%3E%3Ccircle cx='32' cy='39' r='6' fill='%23a7f3d0'/%3E%3C/svg%3E">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tank-battle.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameUI">
            <button class="tb-home-btn" onclick="location.href='index.html'" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            <div id="gameInfo">
                <div>❤️ <span id="livesLabel">生命</span>: <span id="lives">3</span></div>
                <div>🏆 <span id="scoreLabel">分数</span>: <span id="score">0</span></div>
                <div>📊 <span id="levelLabel">关卡</span>: <span id="level">1</span></div>
                <div>🎯 <span id="enemiesLabel">敌人</span>: <span id="enemies">0</span></div>
            </div>
            <canvas id="miniMap" width="120" height="90"></canvas>
            <div id="controls">
                <span id="controlsText">WASD: 移动 | 空格: 射击 | P: 暂停<br>1-3: 切换武器 | R: 重新开始 | L: 切换语言</span>
            </div>
            <div id="weaponInfo">
                🔫 <span id="weaponLabel">武器</span>: <span id="currentWeapon">普通弹</span><br>
                📦 <span id="ammoLabel">弹药</span>: <span id="ammo">∞</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) {
                canonical.setAttribute('href', currentUrl);
            }
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-tank-battle.svg', baseUrl).href;

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', currentUrl);
            }
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) {
                ogImage.setAttribute('content', socialImage);
            }
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) {
                twitterImage.setAttribute('content', socialImage);
            }

            const gameData = {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Tank Battle",
                "url": currentUrl,
                "description": "Protect your base, switch weapons, and survive waves of enemy tanks.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Web",
                "genre": ["Arcade", "Shooter", "Retro"],
                "playMode": "SinglePlayer",
                "image": socialImage,
                "inLanguage": document.documentElement.lang || "zh-CN",
                "publisher": {
                    "@type": "Organization",
                    "name": "Orangely"
                }
            };

            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Mini Games Collection",
                        "item": baseUrl
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Tank Battle",
                        "item": currentUrl
                    }
                ]
            };

            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
    <script type="module" src="js/tank-battle.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
