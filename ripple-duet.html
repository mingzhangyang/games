<body class="science-showcase science-theme-ripple">
    <div class="rd-shell game-shell">
        <!-- 顶栏 HUD -->
        <header class="rd-topbar game-topbar">
            <div class="rd-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 js/game-chrome.js 统一写） -->
                <button data-chrome="home" class="rd-icon-btn game-icon-btn" id="rd-btn-home" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：海面 / 操作数 HUD -->
            <div class="rd-topbar-center game-topbar-center">
                <div class="rd-hud-level" id="rd-hud-level">Wave 1/20</div>
                <div class="rd-cut-box">
                    <span class="rd-cut-value" id="rd-budget">0</span>
                    <span class="rd-par" id="rd-par">Par 0</span>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → sound -->
            <div class="rd-topbar-actions game-topbar-group">
                <button class="rd-icon-btn game-icon-btn" id="rd-reset-btn" title="Reset" aria-label="Reset"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg></button>
                <button data-chrome="stats" type="button" class="rd-icon-btn game-icon-btn rd-stats-btn game-stats-btn" id="rdStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="rdStatsDrawer"></button>
                <button type="button" class="rd-icon-btn game-icon-btn" id="rd-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>

        <!-- 舞台 -->
        <main class="rd-main game-main">
        <div class="rd-stage game-stage" id="rd-stage">
            <canvas class="game-canvas" id="rd-canvas" width="560" height="640"></canvas>

            <!-- 提示 -->
            <div class="rd-toast hidden game-toast" id="rd-toast"></div>

            <!-- 海面、目标读数、源控制台全画在 canvas 上（舞台是 flex-row，
                 正常流塞不进控制台；absolute 的浮动钮又会盖住海面） -->

            <!-- 开始界面 -->
            <div class="rd-overlay game-overlay" id="rd-start">
                <h1 class="rd-title" id="rd-title">Ripple Duet</h1>
                <p class="rd-subtitle" id="rd-subtitle">Two Sources · One Sea</p>
                <div class="rd-hero" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 64 64" fill="none">
                        <g stroke="#6fd8ff" stroke-width="2.4">
                            <circle cx="24" cy="32" r="6"/><circle cx="24" cy="32" r="13"/><circle cx="24" cy="32" r="20"/>
                        </g>
                        <g stroke="#ff9a5c" stroke-width="2.4">
                            <circle cx="42" cy="32" r="6"/><circle cx="42" cy="32" r="13"/><circle cx="42" cy="32" r="20"/>
                        </g>
                        <rect x="31" y="10" width="3" height="44" fill="#04070d"/>
                    </svg>
                </div>
                <p class="rd-howto" id="rd-howto"></p>
                <div class="rd-mode-row">
                    <button class="rd-mode" id="rd-btn-levels"></button>
                    <button class="rd-mode rd-mode-daily" id="rd-btn-daily"></button>
                </div>
                <p class="rd-level-label" id="rd-level-label"></p>
                <div class="rd-level-grid" id="rd-level-grid"></div>
                <p class="rd-daily-best" id="rd-daily-best"></p>
                <div class="rd-start-footer">
                    <button class="rd-icon-btn game-icon-btn" id="rd-start-mute" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                </div>
            </div>

            <!-- 过关面板 -->
            <div class="rd-overlay rd-overlay-dim hidden game-overlay" id="rd-clear">
                <div class="rd-card">
                    <h2 class="rd-card-title" id="rd-clear-stars">☆☆☆</h2>
                    <div class="rd-card-line" id="rd-clear-line"></div>
                    <div class="rd-btn-row">
                        <button class="rd-btn rd-btn-primary game-btn" id="rd-btn-next"><span></span></button>
                        <button class="rd-btn game-btn" id="rd-btn-replay"><span></span></button>
                        <button class="rd-btn rd-btn-ghost game-btn" id="rd-btn-menu1"><span></span></button>
                    </div>
                </div>
            </div>

            <!-- 每日结算 -->
            <div class="rd-overlay hidden game-overlay" id="rd-over">
                <h2 class="rd-overlay-title" id="rd-over-title"></h2>
                <div class="rd-over-score" id="rd-over-score">0</div>
                <div class="rd-over-sub" id="rd-over-sub"></div>
                <div class="rd-btn-row">
                    <button class="rd-btn game-btn" id="rd-btn-copy"><span></span></button>
                    <button class="rd-btn rd-btn-ghost game-btn" id="rd-btn-menu2"><span></span></button>
                </div>
                <div class="rd-lb">
                    <div class="rd-lb-title" id="rd-lb-title"></div>
                    <div class="rd-lb-list" id="rd-lb-list"></div>
                    <div class="rd-lb-status" id="rd-lb-status"></div>
                    <div class="rd-username-row">
                        <label class="rd-username-label" for="rd-username" id="rd-username-label"></label>
                        <input class="rd-username" id="rd-username" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <button class="rd-btn rd-btn-primary game-btn" id="rd-btn-again"><span></span></button>
            </div>
        </div>

            <aside class="rd-sidebar game-sidebar">

            <!-- 由 game-drawer.js 在侧栏 / 底部抽屉之间搬移的面板容器 -->
            <div id="rdStatsPanels">
                <div class="rd-side-card game-side-card">
                    <div class="rd-side-title game-side-title" id="rd-side-howto-title"></div>
                    <p class="rd-side-text game-side-text" id="rd-side-howto"></p>
                </div>
                <div class="rd-side-card game-side-card">
                    <div class="rd-side-title game-side-title" id="rd-side-records-title"></div>
                    <div class="rd-side-records" id="rd-side-records"></div>
                </div>
            </div>

            <!-- 桌面侧栏专属：必须放在 #rdStatsPanels 外面 —— 那个节点会被
                 js/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <div class="rd-side-card game-side-card">
                <div class="rd-side-title game-side-title" id="rd-side-legend-title"></div>
                <div class="rd-side-legend" id="rd-side-legend"></div>
            </div>

            <div class="rd-side-card game-side-card">
                <nav class="more-games" id="rdSideMore"></nav>
            </div>

        </aside>
    </main>



    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只放无状态导航；Sound / Lang 是状态开关，唯一真源在 header。 -->
    <footer class="rd-footer game-footer">
        <p class="rd-footer-hint game-footer-hint" id="rd-hint"></p>
        <div class="rd-footer-actions game-footer-actions game-topbar-group">
            <a class="rd-icon-btn game-icon-btn" data-chrome="home" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            <button type="button" class="rd-icon-btn game-icon-btn" data-chrome="more" aria-expanded="false" aria-controls="rdMoreNav" title="More games" aria-label="More games"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 8.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.2a2.6 2.6 0 0 1-4.7 2L15.6 16H8.4l-1.5 2.4a2.6 2.6 0 0 1-4.7-2l.7-4.2a4.6 4.6 0 0 1 4.5-3.7z"/><path d="M7.5 11.6v3M6 13.1h3"/><circle cx="16.2" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <nav class="more-games game-footer-nav" id="rdMoreNav" hidden></nav>
    </footer>
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <div class="game-drawer" id="rdStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="rdStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="rdStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="rdStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="rdStatsDrawerBody"></div>
        </div>
    </div>
