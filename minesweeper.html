    <div class="ms-shell game-shell">
        <!-- 顶栏 -->
        <header class="ms-topbar game-topbar">
            <div class="ms-topbar-lead game-topbar-group">

                <button class="ms-diff" data-diff="hard" id="ms-diff-hard" data-i18n="hard">Expert</button>
