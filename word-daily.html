                <!-- 左簇：Home 永远第一个；Help 是本页专属入口 -->

                <button class="wd-icon-btn game-icon-btn" id="wd-btn-stats" title="Stats" aria-label="Stats"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg></button>

                    <span class="wd-diff-tag" id="wd-diff-trigger-tag">5</span>
                    <span class="wd-diff-title" id="wd-diff-trigger-label">5 Letters</span>
                    <span class="wd-diff-status" id="wd-diff-status-cur"></span>
                    <svg class="wd-diff-caret" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>

                        <span class="wd-diff-tag">4</span>
                        <span class="wd-diff-title" id="wd-diff-label-4">4 Letters</span>

                    <button type="button" class="wd-diff-opt active" data-len="5" id="wd-diff-5" role="option" aria-selected="true">

                        <span class="wd-diff-title" id="wd-diff-label-6">6 Letters</span>
                        <span class="wd-diff-status" id="wd-diff-status-6"></span>
                    </button>
                </div>
            </div>
        <button data-chrome-moved="1" class="wd-icon-btn wd-lang-btn game-icon-btn game-icon-btn--wide" id="wd-btn-lang" title="Switch mode" aria-label="Switch mode">Idioms</button>

        <main class="wd-main game-main">
            <div class="wd-board-wrap">

            <div class="wd-input-row" id="wd-input-row">

                    <span class="wd-submit-text" id="wd-submit-text">Guess</span>
                </button>
            </div>

                    <div class="wd-end-status" id="wd-end-status"></div>
