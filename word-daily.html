<body>
    <div class="wd-shell">
        <!-- 顶栏 -->
        <header class="wd-topbar">

            </div>
            <div class="wd-title-box">
                <h1 class="wd-title" id="wd-title">Word Daily</h1>
                <div class="wd-sub-row"><span class="wd-num" id="wd-num">#1</span><span class="wd-mode-tag" id="wd-mode-tag"></span></div>
            </div>
            <div class="wd-topbar-group">
                <a class="wd-icon-btn wd-home-link" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
                <button class="wd-icon-btn" id="wd-btn-practice" title="Practice">🎲</button>
                <button class="wd-icon-btn" id="wd-btn-help" title="How to play">❓</button>
                <button class="wd-icon-btn" id="wd-btn-stats" title="Stats">📊</button>
            </div>
        </header>

        <div class="wd-banner hidden" id="wd-practice-banner"></div>

        <!-- 释义提示（成语模式） -->
        <div class="wd-hint-card hidden" id="wd-hint-card">
            <span class="wd-hint-label" id="wd-hint-label">📖 释义</span>
            <span class="wd-hint-text" id="wd-hint-text"></span>
        </div>

        <!-- 棋盘 -->
        <main class="wd-main">
            <div class="wd-board" id="wd-board" style="--cols: 5"></div>
            <div class="wd-toast" id="wd-toast"></div>

            <!-- 结算与进入下一题操作区 -->
            <div class="wd-end-panel hidden" id="wd-end-panel">
                <div class="wd-end-info">
                    <div class="wd-end-status" id="wd-end-status"></div>
                    <div class="wd-end-answer" id="wd-end-answer"></div>
                    <div class="wd-end-hint hidden" id="wd-end-hint"></div>
                </div>
                <div class="wd-end-actions">
                    <button type="button" class="wd-btn wd-btn-success wd-btn-lg wd-btn-block" id="wd-btn-next">
                        <span class="btn-icon">➡️</span>
                        <span id="wd-next-label">下一题（无限练习）</span>
                    </button>
                    <div class="wd-end-sub-actions">
                        <button type="button" class="wd-btn wd-btn-secondary" id="wd-btn-stats-inline">
                            <span class="btn-icon">📊</span>
                            <span id="wd-stats-inline-label">查看战报</span>
                        </button>
                        <button type="button" class="wd-btn wd-btn-secondary" id="wd-btn-share-inline">
                            <span class="btn-icon">📤</span>
                            <span id="wd-share-inline-label">分享成绩</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 中文输入行 -->
            <div class="wd-zh-row hidden" id="wd-zh-input-row">
                <input class="wd-zh-input" id="wd-zh-input" maxlength="4" autocomplete="off" enterkeyhint="send">
                <button class="wd-zh-submit" id="wd-zh-submit">猜</button>
            </div>

            <!-- 英文屏幕键盘 -->
            <div class="wd-kb" id="wd-kb"></div>
        </main>
    </div>

    <!-- 玩法说明 -->
    <div class="wd-modal hidden" id="wd-help-modal">
        <div class="wd-modal-box">
            <h2 class="wd-modal-title" id="wd-help-title">How to play</h2>
            <div class="wd-help-body" id="wd-help-body"></div>
            <button class="wd-btn wd-btn-primary wd-btn-block" id="wd-help-close">OK</button>
        </div>
    </div>

    <!-- 统计 -->
    <div class="wd-modal hidden" id="wd-stats-modal">
        <div class="wd-modal-box">
            <h2 class="wd-modal-title" id="wd-stats-title">Statistics</h2>
            <div class="wd-stat-grid">
                <div class="wd-stat"><span class="wd-stat-num" id="wd-st-played">0</span><span class="wd-stat-label" id="wd-lb-played">Played</span></div>
                <div class="wd-stat"><span class="wd-stat-num" id="wd-st-winrate">0%</span><span class="wd-stat-label" id="wd-lb-winrate">Win %</span></div>
                <div class="wd-stat"><span class="wd-stat-num" id="wd-st-cur">0</span><span class="wd-stat-label" id="wd-lb-cur">Streak</span></div>
                <div class="wd-stat"><span class="wd-stat-num" id="wd-st-max">0</span><span class="wd-stat-label" id="wd-lb-max">Max</span></div>
            </div>
            <h3 class="wd-dist-title" id="wd-dist-title">Guess Distribution</h3>
            <div class="wd-dist" id="wd-dist"></div>
            <div class="wd-global" id="wd-global"></div>
            <button class="wd-btn wd-btn-success wd-btn-block" id="wd-modal-next">
                <span class="btn-icon">➡️</span>
                <span id="wd-modal-next-label">下一题（无限练习）</span>
            </button>
            <button class="wd-btn wd-btn-primary wd-btn-block" id="wd-share">📤 Share</button>
            <div class="wd-countdown" id="wd-countdown"></div>
            <nav class="more-games">
                <div class="more-games-title">🎮 More Games · 更多游戏</div>

              <a href="planet-merge.html">🪐 星球合成</a>
              <a href="hoop-shot.html">🏀 街机投篮</a>
              <a href="minesweeper.html">💣 扫雷</a>
              <a href="reversi.html">⚪ 黑白棋</a>
              <a href="tower-defense.html">🏰 霓虹塔防</a>

            </nav>
            <button class="wd-btn wd-btn-ghost wd-btn-block" id="wd-stats-close">Close</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) {
                canonical.setAttribute('href', currentUrl);
            }
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-word-daily.svg', baseUrl).href;

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', currentUrl);
            }
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) {
                ogImage.setAttribute('content', socialImage);
            }
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) {
                twitterImage.setAttribute('content', socialImage);
            }

            const gameData = {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Word Daily 每日猜词",
                "url": currentUrl,
                "description": "Bilingual daily word puzzle — guess the English word or the Chinese idiom in 6 tries. One puzzle a day for everyone.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Web",
                "genre": ["PuzzleGame", "WordGame"],
                "playMode": "SinglePlayer",
                "image": socialImage,
                "inLanguage": ["en", "zh"],
                "publisher": {
                    "@type": "Organization",
                    "name": "Orangely"
                }
            };

            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Mini Games Collection",
                        "item": baseUrl
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Word Daily",
                        "item": currentUrl
                    }
                ]
            };

            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
    <script type="module" src="js/word-daily.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
