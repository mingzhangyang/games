<body>
    <div class="sd-shell game-shell">
        <!-- 顶栏 HUD -->
        <header class="sd-topbar game-topbar">
            <div class="sd-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 js/game-chrome.js 统一写） -->
                <button data-chrome="home" class="sd-icon-btn game-icon-btn" id="sd-btn-home" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：关卡 / 断丝 HUD，各页自由 -->
            <div class="sd-topbar-center game-topbar-center">
                <div class="sd-hud-level" id="sd-hud-level">Level 1/20</div>
                <div class="sd-cut-box">
                    <span class="sd-cut-value" id="sd-drags">0</span>
                    <span class="sd-par" id="sd-par">· Par 1</span>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → sound → lang -->
            <div class="sd-topbar-actions game-topbar-group">
                <button class="sd-icon-btn game-icon-btn" id="sd-reset-btn" title="Reset" aria-label="Reset"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg></button>
                <button data-chrome="stats" type="button" class="sd-icon-btn game-icon-btn sd-stats-btn game-stats-btn" id="sdStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="sdStatsDrawer"></button>
                <button type="button" class="sd-icon-btn game-icon-btn" id="sd-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>

        <!-- 舞台 -->
        <main class="sd-main game-main">
        <div class="sd-stage game-stage" id="sd-stage">
            <canvas class="game-canvas" id="sd-canvas" width="480" height="640"></canvas>

            <!-- 提示 -->
            <div class="sd-toast hidden game-toast" id="sd-toast"></div>

            <!-- 开始界面 -->
            <div class="sd-overlay game-overlay" id="sd-start">
                <h1 class="sd-title" id="sd-title">Silkfall</h1>
                <p class="sd-subtitle" id="sd-subtitle">Cut · Swing · Catch</p>
                <div class="sd-hero">💧</div>
                <p class="sd-howto" id="sd-howto"></p>
                <div class="sd-mode-row">
                    <button class="sd-mode" id="sd-btn-levels">🧵 Levels</button>
                    <button class="sd-mode sd-mode-daily" id="sd-btn-daily">📅 Daily</button>
                </div>
                <p class="sd-level-label" id="sd-level-label">Select level</p>
                <div class="sd-level-grid" id="sd-level-grid"></div>
                <p class="sd-daily-best" id="sd-daily-best"></p>
                <div class="sd-start-footer">
                    <button class="sd-icon-btn game-icon-btn" id="sd-start-mute" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                </div>
            </div>

            <!-- 过关面板 -->
            <div class="sd-overlay sd-overlay-dim hidden game-overlay" id="sd-clear">
                <div class="sd-card">
                    <h2 class="sd-card-title" id="sd-clear-stars">⭐⭐⭐</h2>
                    <div class="sd-card-line" id="sd-clear-line">Cuts 0 · Par 0</div>
                    <div class="sd-btn-row">
                        <button class="sd-btn sd-btn-primary game-btn" id="sd-btn-next"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h14.5"/><path d="M12.5 6l6 6-6 6"/></svg><span>Next</span></button>
                        <button class="sd-btn game-btn" id="sd-btn-replay"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Retry</span></button>
                        <button class="sd-btn sd-btn-ghost game-btn" id="sd-btn-menu1"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                    </div>
                </div>
            </div>

            <!-- 每日结算 -->
            <div class="sd-overlay hidden game-overlay" id="sd-over">
                <h2 class="sd-overlay-title" id="sd-over-title">Daily complete!</h2>
                <div class="sd-over-score" id="sd-over-score">0</div>
                <div class="sd-over-sub" id="sd-over-sub"></div>
                <div class="sd-btn-row">
                    <button class="sd-btn game-btn" id="sd-btn-copy"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button>
                    <button class="sd-btn sd-btn-ghost game-btn" id="sd-btn-menu2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                </div>
                <div class="sd-lb">
                    <div class="sd-lb-title" id="sd-lb-title">🏆 Global · Today's Course</div>
                    <div class="sd-lb-list" id="sd-lb-list"></div>
                    <div class="sd-lb-status" id="sd-lb-status"></div>
                    <div class="sd-username-row">
                        <label class="sd-username-label" for="sd-username" id="sd-username-label">Username</label>
                        <input class="sd-username" id="sd-username" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <button class="sd-btn sd-btn-primary game-btn" id="sd-btn-again"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Again</span></button>
            </div>
        </div>

            <aside class="sd-sidebar game-sidebar">

            <!-- 由 game-drawer.js 在侧栏 / 底部抽屉之间搬移的面板容器 -->
            <div id="sdStatsPanels">
                <div class="sd-side-card game-side-card">
                    <div class="sd-side-title game-side-title" id="sd-side-howto-title"></div>
                    <p class="sd-side-text game-side-text" id="sd-side-howto"></p>
                </div>
                <div class="sd-side-card game-side-card">
                    <div class="sd-side-title game-side-title" id="sd-side-records-title"></div>
                    <div class="sd-side-records" id="sd-side-records"></div>
                </div>
            </div>

            <!-- 桌面侧栏专属：必须放在 #sdStatsPanels 外面 —— 那个节点会被
                 js/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <div class="sd-side-card game-side-card">
                <nav class="more-games" id="sdSideMore"></nav>
            </div>

        </aside>
    </main>



    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只放无状态导航；Sound / Lang 是状态开关，唯一真源在 header。 -->
    <footer class="sd-footer game-footer">
        <p class="sd-footer-hint game-footer-hint" id="sd-hint"></p>
        <div class="sd-footer-actions game-footer-actions game-topbar-group">
            <a class="sd-icon-btn game-icon-btn" data-chrome="home" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            <button type="button" class="sd-icon-btn game-icon-btn" data-chrome="more" aria-expanded="false" aria-controls="sdMoreNav" title="More games" aria-label="More games"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 8.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.2a2.6 2.6 0 0 1-4.7 2L15.6 16H8.4l-1.5 2.4a2.6 2.6 0 0 1-4.7-2l.7-4.2a4.6 4.6 0 0 1 4.5-3.7z"/><path d="M7.5 11.6v3M6 13.1h3"/><circle cx="16.2" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <nav class="more-games game-footer-nav" id="sdMoreNav" hidden></nav>
    </footer>
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <div class="game-drawer" id="sdStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="sdStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="sdStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="sdStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="sdStatsDrawerBody"></div>
        </div>
    </div>
