</head>
<body>
    <div class="hs-shell game-shell">
        <!-- 顶栏 HUD -->
        <header class="hs-topbar game-topbar">
            <div class="hs-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 js/game-chrome.js 统一写） -->
                <button data-chrome="home" class="hs-icon-btn game-icon-btn" id="hs-btn-home-top" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：标题 / HUD，各页自由 -->
            <div class="hs-topbar-center game-topbar-center">
                <div class="hs-score-box">
                    <div class="hs-score-value" id="hs-score">0</div>
                    <div class="hs-score-sub">🏆 <span id="hs-best">0</span></div>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → pause → sound → lang -->
            <div class="hs-topbar-actions game-topbar-group">
                <button data-chrome="stats" type="button" class="hs-icon-btn game-icon-btn hs-stats-btn game-stats-btn" id="hsStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="hsStatsDrawer"></button>
                <button data-chrome="pause" class="hs-icon-btn game-icon-btn" id="hs-pause-btn" title="Pause" aria-label="Pause"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8.5 5v14M15.5 5v14"/></svg></button>
                <button type="button" class="hs-icon-btn game-icon-btn" id="hs-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>

        <div class="hs-streak-bar" id="hs-streak"></div>

        <!-- 游戏区 -->
        <main class="hs-main game-main">
        <div class="hs-stage game-stage game-stage--fill">
            <canvas class="game-canvas" id="hs-canvas" width="420" height="640"></canvas>
            <div class="hs-fire-badge" id="hs-fire-badge">🔥</div>

            <!-- 开始界面 -->
            <div class="hs-overlay game-overlay" id="hs-start">
                <h1 class="hs-title" id="hs-title">Hoop Shot</h1>
                <p class="hs-subtitle" id="hs-subtitle">Flick · Arc · Score</p>
                <div class="hs-ball-row">🏀</div>
                <p class="hs-howto" id="hs-howto"></p>
                <button class="hs-btn hs-btn-primary" id="hs-btn-play">🏀 Play</button>
                <p class="hs-stat-line" id="hs-best-line"></p>
                <div class="hs-start-footer">
                    <button class="hs-icon-btn game-icon-btn" id="hs-start-mute" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                </div>
            </div>

            <!-- 暂停界面 -->
            <div class="hs-overlay hidden game-overlay" id="hs-pause">
                <h2 class="hs-overlay-title" id="hs-pause-title">Paused</h2>
                <div class="hs-btn-col">
                    <button class="hs-btn hs-btn-primary" id="hs-btn-resume">Resume</button>
                    <button class="hs-btn hs-btn-ghost game-btn" id="hs-btn-menu"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                </div>
            </div>

            <!-- 结算界面 -->
            <div class="hs-overlay hidden game-overlay" id="hs-over">
                <h2 class="hs-overlay-title" id="hs-over-title">Game Over</h2>
                <div class="hs-newbest" id="hs-over-newbest"></div>
                <div class="hs-over-score" id="hs-over-score">0</div>
                <div class="hs-over-best" id="hs-over-best"></div>
                <div class="hs-over-streak" id="hs-over-streak"></div>
                <div class="hs-btn-row">
                    <button class="hs-btn hs-btn-primary game-btn" id="hs-btn-again"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Again</span></button>
                    <button class="hs-btn game-btn" id="hs-btn-share"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17.5" cy="5.5" r="2.8"/><circle cx="6.5" cy="12" r="2.8"/><circle cx="17.5" cy="18.5" r="2.8"/><path d="M9.1 10.7l5.8-3.4M9.1 13.3l5.8 3.4"/></svg><span>Share</span></button>
                    <button class="hs-btn game-btn" id="hs-btn-copy"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button>
                </div>
                <div class="hs-lb">
                    <div class="hs-lb-title" id="hs-lb-title">🏆 Global Top 10</div>
                    <div class="hs-lb-list" id="hs-lb-list"></div>
                    <div class="hs-lb-status" id="hs-lb-status"></div>
                    <div class="hs-username-row">
                        <label class="hs-username-label" for="hs-username" id="hs-username-label">Username</label>
                        <input class="hs-username" id="hs-username" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <button class="hs-btn hs-btn-ghost game-btn" id="hs-btn-home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
            </div>
        </div>

            <aside class="hs-sidebar game-sidebar">

            <!-- 由 apply-stats-drawer.py 生成的搬迁节点：JS 在侧栏 / 底部抽屉之间搬移它 -->
            <div id="hsStatsPanels">
                <div class="hs-side-card game-side-card">
                    <div class="hs-side-title game-side-title" id="hs-side-howto-title"></div>
                    <p class="hs-side-text game-side-text" id="hs-side-howto"></p>
                </div>
                <div class="hs-side-card game-side-card">
                    <div class="hs-side-title game-side-title" id="hs-side-records-title"></div>
                    <div class="hs-side-records" id="hs-side-records"></div>
                </div>
            </div>

            <!-- 桌面侧栏专属：必须放在 #hsStatsPanels 外面 —— 那个节点会被
                 js/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <div class="hs-side-card game-side-card">
                <nav class="more-games" id="hsSideMore"></nav>
            </div>

        </aside>
    </main>

    

    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只放无状态导航；Sound / Lang 是状态开关，唯一真源在 header。 -->
    <footer class="hs-footer game-footer">
        <p class="hs-footer-hint game-footer-hint" id="hs-hint">Swipe up to shoot · P pause · M mute</p>
        <div class="hs-footer-actions game-footer-actions game-topbar-group">
            <a class="hs-icon-btn game-icon-btn" data-chrome="home" href="index.html" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></a>
            <button type="button" class="hs-icon-btn game-icon-btn" data-chrome="more" aria-expanded="false" aria-controls="hsMoreNav" title="More games" aria-label="More games"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.4 8.5h9.2a4.6 4.6 0 0 1 4.5 3.7l.7 4.2a2.6 2.6 0 0 1-4.7 2L15.6 16H8.4l-1.5 2.4a2.6 2.6 0 0 1-4.7-2l.7-4.2a4.6 4.6 0 0 1 4.5-3.7z"/><path d="M7.5 11.6v3M6 13.1h3"/><circle cx="16.2" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.1" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        </div>
        <nav class="more-games game-footer-nav" id="hsMoreNav" hidden></nav>
    </footer>
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <div class="game-drawer" id="hsStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="hsStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="hsStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="hsStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="hsStatsDrawerBody"></div>
        </div>
    </div>
