    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) {
                canonical.setAttribute('href', currentUrl);
            }
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-hoop-shot.svg', baseUrl).href;

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) {
                ogUrl.setAttribute('content', currentUrl);
            }
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) {
                ogImage.setAttribute('content', socialImage);
            }
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) {
                twitterImage.setAttribute('content', socialImage);
            }

            const gameData = {
                "@context": "https://schema.org",
                "@type": "VideoGame",
                "name": "Hoop Shot 街机投篮",
                "url": currentUrl,
                "description": "Flick basketball arcade game — swipe to shoot, chain streaks for fire mode, one miss ends the run. Global top 10 leaderboard.",
                "applicationCategory": "GameApplication",
                "operatingSystem": "Web",
                "genre": ["SportsGame", "ArcadeGame"],
                "playMode": "SinglePlayer",
                "image": socialImage,
                "inLanguage": document.documentElement.lang || "en",
                "publisher": {
                    "@type": "Organization",
                    "name": "Orangely"
                }
            };

            const breadcrumb = {
                "@context": "https://schema.org",
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Mini Games Collection",
                        "item": baseUrl
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": "Hoop Shot",
                        "item": currentUrl
                    }
                ]
            };

            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
