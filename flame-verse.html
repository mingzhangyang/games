<body class="science-showcase science-theme-flame">
    <div class="fv-shell game-shell">
        <!-- 顶栏 HUD -->
        <!-- registry:begin topbar -->
        <header class="fv-topbar game-topbar">
            <div class="fv-topbar-lead game-topbar-group">
                <button data-chrome="home" class="fv-icon-btn game-icon-btn" id="fv-btn-home" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <div class="fv-topbar-center game-topbar-center">
                <div class="fv-brand game-topbar-name" data-i18n="title">Flame Verse</div>
            </div>
            <div class="fv-topbar-actions game-topbar-group">
                <button type="button" data-contextual-restart="retry" class="fv-icon-btn game-icon-btn hidden" id="fv-reset-btn" title="Reset" aria-label="Reset" data-topbar-action="restart"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg></button>
                <button data-chrome="stats" type="button" class="fv-icon-btn game-icon-btn fv-stats-btn game-stats-btn" id="fvStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="fvStatsDrawer" data-topbar-action="stats"></button>
                <button type="button" class="fv-icon-btn game-icon-btn" id="fv-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound" data-topbar-action="sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>
        <!-- registry:end topbar -->

        <!-- 舞台 -->
        <main class="fv-main game-main">
        <div class="fv-stage game-stage" id="fv-stage">
            <!-- 局内状态：关卡 / 计数挂在舞台顶部（css/stage-status.css） -->
            <div class="fv-stage-status game-stage-status" id="fv-stage-status">
                <div class="fv-hud-level" id="fv-hud-level">Sample 1/3</div>
                <div class="fv-cut-box game-cut-box">
                    <span class="fv-cut-value game-cut-value" id="fv-budget">0</span>
                    <span class="fv-par game-start-par" id="fv-par">Par 0</span>
                </div>
            </div>
            <canvas class="game-canvas" id="fv-canvas" width="560" height="424"></canvas>

            <!-- 提示 -->
            <div class="fv-toast hidden game-toast" id="fv-toast"></div>

            <section class="fv-lab" id="fv-lab" aria-label="Salt rack">
                <div class="fv-reagents" id="fv-reagents"></div>
                <p class="fv-dose" id="fv-dose"></p>
                <div class="fv-lab-actions">
                    <button type="button" class="fv-lab-button fv-add" id="fv-add-btn"></button>
                    <button type="button" class="fv-lab-button" id="fv-clear-btn"><span class="sci-action-label"></span><span class="fv-empty-cost"></span></button>
                    <button type="button" class="fv-lab-button fv-assay" id="fv-run-btn"><span class="sci-action-label"></span></button>
                </div>
                <p class="fv-lab-status" id="fv-lab-status" role="status" aria-live="polite"></p>
            </section>

            <!-- 开始界面 -->
            <div class="fv-overlay game-overlay game-overlay--menu" id="fv-start">
                <h1 class="fv-title game-start-title" id="fv-title" data-i18n="title">Flame Verse</h1>
                <p class="fv-subtitle game-start-subtitle" id="fv-subtitle" data-i18n="subtitle">Salt · Flame · Light</p>
                <div class="fv-hero" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 64 64" fill="none">
                        <path d="M32 6c8 10 14 16 14 26a14 14 0 1 1-28 0c0-7 3.5-11 7-16 .5 5 2 8.5 5.5 10.5C29 18 30 11.5 32 6z" fill="#ffb35c" opacity="0.92"/>
                        <path d="M32 27c4.2 5 7 8 7 12.6A7 7 0 1 1 25 39.6c0-4.6 2.8-7.6 7-12.6z" fill="#ffd34d" opacity="0.95"/>
                        <path d="M10 58h44" stroke="#5b8dee" stroke-width="2" opacity="0.5"/>
                        <path d="M14 55v6M27 53v8M40 54v7M50 56v5" stroke="#ffd34d" stroke-width="2" opacity="0.75"/>
                    </svg>
                </div>
                <p class="fv-howto game-start-howto sci-howto-steps" id="fv-howto" data-i18n="howto" data-i18n-touch="howtoTouch"></p>
                <div class="fv-mode-row game-start-mode-row">
                    <button class="fv-mode game-start-mode" id="fv-btn-levels"></button>
                    <button class="fv-mode fv-mode-daily game-start-mode game-start-mode--daily" id="fv-btn-daily"></button>
                </div>
                <p class="fv-level-label game-start-level-label" id="fv-level-label" data-i18n="levelSelect"></p>
                <div class="fv-level-grid game-start-level-grid" id="fv-level-grid"></div>
                <p class="fv-daily-best game-start-daily-best" id="fv-daily-best"></p>
            </div>

            <!-- 过关面板 -->
            <!-- registry:begin result-clear -->
            <div class="fv-overlay fv-overlay-dim hidden game-overlay" id="fv-clear">
                <div class="fv-card">
                    <h2 class="fv-card-title game-clear-title" id="fv-clear-stars">☆☆☆</h2>
                    <div class="fv-card-line game-start-card-line" id="fv-clear-line"></div>
                    <div class="game-lb-status hidden" id="fv-clear-status" role="status"></div>
                    <div class="fv-btn-row game-action-row">
                        <button class="fv-btn fv-btn-primary game-btn game-action-btn game-action-btn--primary" id="fv-btn-next"><span></span></button>
                        <button class="fv-btn game-btn game-action-btn" id="fv-btn-replay"><span></span></button>
                        <button class="fv-btn fv-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="fv-btn-menu1"><span></span></button>
                    </div>
                </div>
            </div>
            <!-- registry:end result-clear -->

            <!-- 每日结算 -->
            <!-- registry:begin result-over -->
            <div class="fv-overlay hidden game-overlay" id="fv-over">
                <h2 class="fv-overlay-title" id="fv-over-title"></h2>
                <div class="fv-over-score game-over-score" id="fv-over-score">0</div>
                <div class="fv-over-sub game-over-sub" id="fv-over-sub"></div>
                <div class="fv-btn-row game-action-row">
                    <button class="fv-btn game-btn game-action-btn" id="fv-btn-copy"><span></span></button>
                    <button class="fv-btn fv-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="fv-btn-menu2"><span></span></button>
                </div>
                <div class="fv-lb game-lb">
                    <div class="fv-lb-title game-lb-title" id="fv-lb-title" data-i18n="leaderboard"></div>
                    <div class="fv-lb-list game-lb-list" id="fv-lb-list"></div>
                    <div class="fv-lb-status game-lb-status" id="fv-lb-status" role="status"></div>
                    <div class="fv-username-row game-lb-username-row">
                        <label class="fv-username-label game-lb-username-label" for="fv-username" id="fv-username-label"></label>
                        <input class="fv-username game-lb-username" id="fv-username" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <button class="fv-btn fv-btn-primary game-btn game-action-btn game-action-btn--primary" id="fv-btn-again"><span></span></button>
            </div>
            <!-- registry:end result-over -->
        </div>

            <aside class="fv-sidebar game-sidebar">

            <!-- 由 game-drawer.js 在侧栏 / 底部抽屉之间搬移的面板容器 -->
            <div id="fvStatsPanels">
                <!-- registry:begin sidebar-howto -->
                <div class="fv-side-card game-side-card">
                    <div class="fv-side-title game-side-title" id="fv-side-howto-title" data-i18n="sideHowTo"></div>
                    <p class="fv-side-text game-side-text sci-howto-steps" id="fv-side-howto" data-i18n="howto" data-i18n-touch="howtoTouch"></p>
                    <p class="fv-side-text game-side-text sci-howto-science" id="fv-side-science" data-i18n="howtoScience"></p>
                </div>
                <!-- registry:end sidebar-howto -->
                <!-- registry:begin sidebar-records -->
                <div class="fv-side-card game-side-card">
                    <div class="fv-side-title game-side-title" id="fv-side-records-title" data-i18n="sideRecords"></div>
                    <div class="fv-side-records game-side-records" id="fv-side-records"></div>
                </div>
                <!-- registry:end sidebar-records -->
            </div>

            <!-- 桌面侧栏专属：必须放在 #fvStatsPanels 外面 —— 那个节点会被
                 src/platform/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <!-- registry:begin sidebar-legend -->
            <div class="fv-side-card game-side-card">
                <div class="fv-side-title game-side-title" id="fv-side-legend-title" data-i18n="legendTitle"></div>
                <div class="fv-side-legend game-side-legend" id="fv-side-legend"></div>
            </div>
            <!-- registry:end sidebar-legend -->

            <!-- registry:begin sidebar-more -->
            <div class="fv-side-card game-side-card">
                <nav class="more-games" id="fvSideMore"></nav>
            </div>
            <!-- registry:end sidebar-more -->

        </aside>
    </main>



    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只保留操作提示；导航与状态控件统一留在 header / 页面主体。 -->
    <!-- registry:begin footer -->
    <footer class="fv-footer game-footer">
        <p class="fv-footer-hint game-footer-hint" id="fv-hint" data-i18n="hint" data-i18n-touch="hintTouch"></p>
    </footer>
    <!-- registry:end footer -->
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <!-- registry:begin stats-drawer -->
    <div class="game-drawer" id="fvStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="fvStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="fvStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="fvStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="fvStatsDrawerBody"></div>
        </div>
    </div>
    <!-- registry:end stats-drawer -->
