<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- registry:begin head -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-support" content="dark">
    <meta name="theme-color" content="#0a0e24">
    <script src="/theme-boot.js"></script>
    <meta name="description" content="Planet Merge — drop planets, merge identical ones, chain combos and forge a sun in this addictive physics merge game. Daily challenge with a global leaderboard.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Orangely">
    <link rel="canonical" id="canonical-link" href="https://games.orangely.xyz/planet-merge.html">
    <meta property="og:title" content="Planet Merge — Drop, Merge, Chain the Cosmos">
    <meta property="og:description" content="Merge identical planets to forge a sun. Chain combos, beat the daily challenge, climb the global leaderboard.">
    <meta property="og:site_name" content="Mini Games Collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/seo/og-planet-merge.svg">
    <meta property="og:url" content="https://games.orangely.xyz/planet-merge.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Planet Merge — Drop, Merge, Chain the Cosmos">
    <meta name="twitter:description" content="Merge identical planets to forge a sun. Daily challenge with global leaderboard.">
    <meta name="twitter:image" content="assets/seo/og-planet-merge.svg">
    <title>Planet Merge — Cosmic Merge Puzzle</title>
    <!-- registry:end head -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23d7914f'/%3E%3Cellipse cx='32' cy='34' rx='40' ry='10' fill='none' stroke='%23f0d9a0' stroke-width='4' transform='rotate(-20 32 34)'/%3E%3C/svg%3E">
        <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/planet-merge.css">
    <link rel="stylesheet" href="css/more-games.css">
</head>
<body class="game-reset">
    <div class="pm-shell game-shell">
        <!-- 顶栏 HUD -->
        <header class="pm-topbar game-topbar">
            <div class="pm-topbar-lead game-topbar-group">
                <!-- 左簇：Home 永远第一个（文案 / aria 由 src/platform/game-chrome.js 统一写） -->
                <button data-chrome="home" class="pm-icon-btn game-icon-btn" id="pm-home-btn" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <!-- 中槽：标题 / HUD，各页自由 -->
            <div class="pm-topbar-center game-topbar-center">
                <div class="pm-scores">
                    <div class="pm-score-main"><span class="pm-score-label" id="pm-score-label" data-i18n="score">Score</span><span class="pm-score-value" id="pm-score">0</span></div>
                    <div class="pm-score-sub">🏆 <span id="pm-best">0</span> · <span id="pm-mode-label">♾️</span></div>
                </div>
            </div>
            <!-- 右簇固定顺序：专属 → stats → pause → sound → lang -->
            <div class="pm-topbar-actions game-topbar-group">
                <button data-chrome="stats" type="button" class="pm-icon-btn game-icon-btn pm-stats-btn game-stats-btn" id="pmStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="pmStatsDrawer"></button>
                <button data-chrome="pause" class="pm-icon-btn game-icon-btn" id="pm-pause-btn" title="Pause" aria-label="Pause"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8.5 5v14M15.5 5v14"/></svg></button>
                <button type="button" class="pm-icon-btn game-icon-btn" id="pm-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>

        <!-- 游戏区 -->
        <main class="pm-main game-main">
        <div class="pm-stage game-stage game-stage--fill">
            <canvas class="game-canvas" id="pm-canvas" width="420" height="640"></canvas>
            <div class="pm-next-box" aria-hidden="true">
                <span class="pm-next-label" id="pm-next-label" data-i18n="next">Next</span>
                <span class="pm-next-emoji" id="pm-next-emoji">🌙</span>
            </div>

            <!-- 开始界面 -->
            <div class="pm-overlay game-overlay game-overlay--menu" id="pm-start">
                <h1 class="pm-title" id="pm-title" data-i18n="title">Planet Merge</h1>
                <p class="pm-subtitle" id="pm-subtitle" data-i18n="subtitle">Drop · Merge · Chain the cosmos</p>
                <div class="pm-chain" id="pm-chain"></div>
                <div class="pm-skin-row" id="pm-skin-row"></div>
                <p class="pm-howto" id="pm-howto" data-i18n="howto"></p>
                <div class="pm-btn-col">
                    <button class="pm-btn pm-btn-primary game-action-btn game-action-btn--primary" id="pm-btn-endless">♾️ Endless</button>
                    <button class="pm-btn pm-btn-daily game-action-btn" id="pm-btn-daily">📅 Daily Challenge</button>
                </div>
                <p class="pm-daily-note" id="pm-daily-note" data-i18n="dailySameForAll"></p>
                <p class="pm-stat-line" id="pm-best-line"></p>
                <p class="pm-stat-line pm-daily-best" id="pm-daily-best-line"></p>
                <div class="pm-start-footer">
                    <button class="pm-icon-btn game-icon-btn" id="pm-start-mute" aria-label="Sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
                </div>
            </div>

            <!-- 暂停界面 -->
            <div class="pm-overlay hidden game-overlay" id="pm-pause">
                <h2 class="pm-overlay-title" id="pm-pause-title" data-i18n="paused">Paused</h2>
                <div class="pm-btn-col">
                    <button class="pm-btn pm-btn-primary game-action-btn game-action-btn--primary" id="pm-btn-resume" data-i18n="resume">Resume</button>
                    <button class="pm-btn game-action-btn" id="pm-btn-restart" data-i18n="restart">Restart</button>
                    <button class="pm-btn pm-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="pm-btn-menu"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
                </div>
            </div>

            <!-- 结算界面 -->
            <div class="pm-overlay hidden game-overlay" id="pm-over">
                <h2 class="pm-overlay-title" id="pm-over-title" data-i18n="gameOver">Game Over</h2>
                <div class="pm-newbest" id="pm-over-newbest"></div>
                <div class="pm-over-score" id="pm-over-score">0</div>
                <div class="pm-over-best" id="pm-over-best"></div>
                <div class="pm-over-stats">
                    <div class="pm-stat" id="pm-over-max"></div>
                    <div class="pm-stat" id="pm-over-suns"></div>
                    <div class="pm-stat" id="pm-over-merges"></div>
                </div>
                <div class="pm-btn-row game-action-row">
                    <button class="pm-btn pm-btn-primary game-btn game-action-btn game-action-btn--primary" id="pm-btn-again"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg><span>Again</span></button>
                    <button class="pm-btn game-btn game-action-btn" id="pm-btn-share"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17.5" cy="5.5" r="2.8"/><circle cx="6.5" cy="12" r="2.8"/><circle cx="17.5" cy="18.5" r="2.8"/><path d="M9.1 10.7l5.8-3.4M9.1 13.3l5.8 3.4"/></svg><span>Share</span></button>
                    <button class="pm-btn game-btn game-action-btn" id="pm-btn-copy"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><span>Copy</span></button>
                </div>
                <div class="pm-lb game-lb">
                    <div class="pm-lb-head pm-lb-title game-lb-title">
                        <span id="pm-lb-title">🏆 Leaderboard</span>
                        <div class="pm-lb-tabs">
                            <button class="pm-lb-tab active" id="pm-tab-daily" data-i18n="today">Today</button>
                            <button class="pm-lb-tab" id="pm-tab-alltime" data-i18n="allTime">All-Time</button>
                        </div>
                    </div>
                    <div class="pm-lb-list game-lb-list" id="pm-lb-list"></div>
                    <div class="pm-lb-status game-lb-status" id="pm-lb-status"></div>
                    <div class="pm-username-row game-lb-username-row">
                        <label class="pm-username-label game-lb-username-label" for="pm-username" id="pm-username-label" data-i18n="usernameLabel">Username</label>
                        <input class="pm-username game-lb-username" id="pm-username" maxlength="20" autocomplete="off" data-i18n-placeholder="usernameLabel">
                    </div>
                </div>
                <button class="pm-btn pm-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="pm-btn-home2"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg><span>Home</span></button>
            </div>
        </div>

            <aside class="pm-sidebar game-sidebar">

            <!-- 由 apply-stats-drawer.py 生成的搬迁节点：JS 在侧栏 / 底部抽屉之间搬移它 -->
            <div id="pmStatsPanels">
                <div class="pm-side-card game-side-card">
                    <div class="pm-side-title game-side-title" id="pm-side-howto-title"></div>
                    <p class="pm-side-text game-side-text" id="pm-side-howto" data-i18n="howto"></p>
                </div>
                <div class="pm-side-card game-side-card">
                    <div class="pm-side-title game-side-title" id="pm-side-records-title"></div>
                    <div class="pm-side-records" id="pm-side-records"></div>
                </div>
            </div>

            <!-- 桌面侧栏专属：必须放在 #pmStatsPanels 外面 —— 那个节点会被
                 src/platform/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <div class="pm-side-card game-side-card">
                <nav class="more-games" id="pmSideMore"></nav>
            </div>

        </aside>
    </main>

    

    <div class="pm-toast game-toast" id="pm-toast" role="status" aria-live="polite"></div>

    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只保留操作提示；导航与状态控件统一留在 header / 页面主体。 -->
    <footer class="pm-footer game-footer">
        <p class="pm-footer-hint game-footer-hint">P 暂停 · M 静音 · R 重开</p>
    </footer>
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <div class="game-drawer" id="pmStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="pmStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="pmStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="pmStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="pmStatsDrawerBody"></div>
        </div>
    </div>


        <!-- registry:begin seo-script -->

        document.addEventListener('DOMContentLoaded', () => {
            const currentUrl = window.location.href.split('#')[0];
            const canonical = document.getElementById('canonical-link');
            if (canonical) canonical.setAttribute('href', currentUrl);
            const baseUrl = new URL('.', currentUrl).href;
            const socialImage = new URL('assets/seo/og-planet-merge.svg', baseUrl).href;
            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', currentUrl);
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) ogImage.setAttribute('content', socialImage);
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            if (twitterImage) twitterImage.setAttribute('content', socialImage);
            const gameData = {"@context":"https://schema.org","@type":"VideoGame","name":"Planet Merge — Drop, Merge, Chain the Cosmos","url":currentUrl,"description":"Planet Merge — drop planets, merge identical ones, chain combos and forge a sun in this addictive physics merge game. Daily challenge with a global leaderboard.","applicationCategory":"GameApplication","operatingSystem":"Web","genre":["CasualGame","PuzzleGame"],"playMode":"SinglePlayer","image":socialImage,"inLanguage":document.documentElement.lang||"en","publisher":{"@type":"Organization","name":"Orangely"}};
            const breadcrumb = {"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Mini Games Collection","item":baseUrl},{"@type":"ListItem","position":2,"name":"Planet Merge — Drop, Merge, Chain the Cosmos","item":currentUrl}]};
            [gameData, breadcrumb].forEach(data => {
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.textContent = JSON.stringify(data);
                document.head.appendChild(script);
            });
        });
    </script>
        <!-- registry:end seo-script -->
    <script type="module" src="js/planet-merge.js"></script>
    <script src="/analytics.js" defer></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
