<body class="science-showcase science-theme-crystal">
    <div class="cb-shell game-shell">
        <!-- 顶栏 HUD -->
        <!-- registry:begin topbar -->
        <header class="cb-topbar game-topbar">
            <div class="cb-topbar-lead game-topbar-group">
                <button data-chrome="home" class="cb-icon-btn game-icon-btn" id="cb-btn-home" title="Home" aria-label="Home"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.3V21h13V9.3"/></svg></button>
            </div>
            <div class="cb-topbar-center game-topbar-center">
                <div class="cb-brand game-topbar-name" data-i18n="title">Crystal Bloom</div>
            </div>
            <div class="cb-topbar-actions game-topbar-group">
                <button type="button" data-contextual-restart="retry" class="cb-icon-btn game-icon-btn hidden" id="cb-reset-btn" title="Reset" aria-label="Reset" data-topbar-action="restart"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v4h-4"/></svg></button>
                <button data-chrome="stats" type="button" class="cb-icon-btn game-icon-btn cb-stats-btn game-stats-btn" id="cbStatsToggle" aria-label="Stats" aria-haspopup="dialog" aria-expanded="false" aria-controls="cbStatsDrawer" data-topbar-action="stats"></button>
                <button type="button" class="cb-icon-btn game-icon-btn" id="cb-mute-btn" data-chrome="sound" title="Sound" aria-label="Sound" data-topbar-action="sound"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M4 9v6h4l5 4.5v-15L8 9H4z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.7a4.6 4.6 0 0 1 0 6.6"/><path d="M19 6.2a8.2 8.2 0 0 1 0 11.6"/></svg></button>
            </div>
        </header>
        <!-- registry:end topbar -->

        <!-- 舞台 -->
        <main class="cb-main game-main">
        <div class="cb-stage game-stage" id="cb-stage">
            <!-- 局内状态：关卡 / 计数挂在舞台顶部（css/stage-status.css） -->
            <div class="cb-stage-status game-stage-status" id="cb-stage-status">
                <div class="cb-hud-level" id="cb-hud-level">Vessel 1/3</div>
                <div class="cb-cut-box game-cut-box">
                    <span class="cb-cut-value game-cut-value" id="cb-budget">120</span>
                    <span class="cb-par game-start-par" id="cb-par">Par 48</span>
                </div>
            </div>
            <canvas class="game-canvas" id="cb-canvas" width="560" height="640"></canvas>

            <!-- 提示 -->
            <div class="cb-toast hidden game-toast" id="cb-toast"></div>

            <form class="cb-cooling" id="cb-cooling">
                <div class="cb-reading" id="cb-reading" aria-live="off"></div>
                <p id="cb-last-anchor"></p>
                <div class="cb-anchor-fields">
                    <label><span id="cb-time-label">Simulation time</span><input type="number" id="cb-anchor-time" step="1" required inputmode="numeric"></label>
                    <label><span id="cb-temp-label">Temperature (°C)</span><input type="number" id="cb-anchor-temp" step="0.5" required inputmode="decimal"></label>
                    <button type="submit" id="cb-anchor-add"></button>
                </div>
                <p id="cb-anchor-feedback" role="status" aria-live="polite"></p>
                <div class="cb-cooling-actions" id="cb-action-row">
                    <button type="button" class="cb-cooling-button" id="cb-run-btn"><span class="sci-action-label" data-i18n="grow">Grow</span></button>
                    <button type="button" class="cb-cooling-button" id="cb-stir-btn"><span class="sci-action-label" data-i18n="stir">Stir</span></button>
                </div>
            </form>

            <!-- 开始界面 -->
            <div class="cb-overlay game-overlay game-overlay--menu" id="cb-start">
                <h1 class="cb-title game-start-title" id="cb-title" data-i18n="title">Crystal Bloom</h1>
                <p class="cb-subtitle game-start-subtitle" id="cb-subtitle" data-i18n="subtitle">Draw · Chill · Grow</p>
                <div class="cb-hero" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 64 64" fill="none">
                        <path d="M32 6 46 24 32 58 18 24z" fill="#6fd8ff" opacity="0.9"/>
                        <path d="M32 6 32 58 18 24z" fill="#a8e8ff" opacity="0.5"/>
                        <path d="M18 24h28M32 6v52" stroke="#ffd34d" stroke-width="1.6" opacity="0.65"/>
                        <circle cx="32" cy="32" r="26" stroke="#a8b8ff" stroke-width="1.6" opacity="0.35"/>
                    </svg>
                </div>
                <p class="cb-howto game-start-howto sci-howto-steps" id="cb-howto" data-i18n="howto" data-i18n-touch="howtoTouch"></p>
                <div class="cb-mode-row game-start-mode-row">
                    <button class="cb-mode game-start-mode" id="cb-btn-levels"></button>
                    <button class="cb-mode cb-mode-daily game-start-mode game-start-mode--daily" id="cb-btn-daily"></button>
                </div>
                <p class="cb-level-label game-start-level-label" id="cb-level-label" data-i18n="levelSelect"></p>
                <div class="cb-level-grid game-start-level-grid" id="cb-level-grid"></div>
                <p class="cb-daily-best game-start-daily-best" id="cb-daily-best"></p>
            </div>

            <!-- 过关面板 -->
            <div class="cb-overlay cb-overlay-dim hidden game-overlay" id="cb-clear">
                <div class="cb-card">
                    <h2 class="cb-card-title game-clear-title" id="cb-clear-stars">☆☆☆</h2>
                    <div class="cb-card-line game-start-card-line" id="cb-clear-line"></div>
                    <div class="game-lb-status hidden" id="cb-clear-status" role="status"></div>
                    <div class="cb-btn-row game-action-row">
                        <button class="cb-btn cb-btn-primary game-btn game-action-btn game-action-btn--primary" id="cb-btn-next"><span></span></button>
                        <button class="cb-btn game-btn game-action-btn" id="cb-btn-replay"><span></span></button>
                        <button class="cb-btn cb-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="cb-btn-menu1"><span></span></button>
                    </div>
                </div>
            </div>

            <!-- 每日结算 -->
            <div class="cb-overlay hidden game-overlay" id="cb-over">
                <h2 class="cb-overlay-title" id="cb-over-title"></h2>
                <div class="cb-over-score game-over-score" id="cb-over-score">0</div>
                <div class="cb-over-sub game-over-sub" id="cb-over-sub"></div>
                <div class="cb-btn-row game-action-row">
                    <button class="cb-btn game-btn game-action-btn" id="cb-btn-copy"><span></span></button>
                    <button class="cb-btn cb-btn-ghost game-btn game-action-btn game-action-btn--ghost" id="cb-btn-menu2"><span></span></button>
                </div>
                <div class="cb-lb game-lb">
                    <div class="cb-lb-title game-lb-title" id="cb-lb-title" data-i18n="leaderboard"></div>
                    <div class="cb-lb-list game-lb-list" id="cb-lb-list"></div>
                    <div class="cb-lb-status game-lb-status" id="cb-lb-status" role="status"></div>
                    <div class="cb-username-row game-lb-username-row">
                        <label class="cb-username-label game-lb-username-label" for="cb-username" id="cb-username-label"></label>
                        <input class="cb-username game-lb-username" id="cb-username" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <button class="cb-btn cb-btn-primary game-btn game-action-btn game-action-btn--primary" id="cb-btn-again"><span></span></button>
            </div>
        </div>

            <aside class="cb-sidebar game-sidebar">

            <!-- 由 game-drawer.js 在侧栏 / 底部抽屉之间搬移的面板容器 -->
            <div id="cbStatsPanels">
                <!-- registry:begin sidebar-howto -->
                <div class="cb-side-card game-side-card">
                    <div class="cb-side-title game-side-title" id="cb-side-howto-title" data-i18n="sideHowTo"></div>
                    <p class="cb-side-text game-side-text sci-howto-steps" id="cb-side-howto" data-i18n="howto" data-i18n-touch="howtoTouch"></p>
                    <p class="cb-side-text game-side-text sci-howto-science" id="cb-side-science" data-i18n="howtoScience"></p>
                </div>
                <!-- registry:end sidebar-howto -->
                <!-- registry:begin sidebar-records -->
                <div class="cb-side-card game-side-card">
                    <div class="cb-side-title game-side-title" id="cb-side-records-title" data-i18n="sideRecords"></div>
                    <div class="cb-side-records game-side-records" id="cb-side-records"></div>
                </div>
                <!-- registry:end sidebar-records -->
            </div>

            <!-- 桌面侧栏专属：必须放在 #cbStatsPanels 外面 —— 那个节点会被
                 src/platform/game-drawer.js 整体搬进移动端抽屉，放进去会与页脚「更多游戏」重复；
                 放在外面则只在桌面侧栏出现（窄屏 aside 本来就被 has-stats-drawer 隐藏） -->
            <!-- registry:begin sidebar-legend -->
            <div class="cb-side-card game-side-card">
                <div class="cb-side-title game-side-title" id="cb-side-legend-title" data-i18n="legendTitle"></div>
                <div class="cb-side-legend game-side-legend" id="cb-side-legend"></div>
            </div>
            <!-- registry:end sidebar-legend -->

            <!-- registry:begin sidebar-more -->
            <div class="cb-side-card game-side-card">
                <nav class="more-games" id="cbSideMore"></nav>
            </div>
            <!-- registry:end sidebar-more -->

        </aside>
    </main>



    <!-- 持久页脚：随流在底部（不用 sticky/fixed，避免与移动端底栏、
         统计抽屉、结算浮层抢层级，也不吃竖版画布高度）。
         ⚠️ 只保留操作提示；导航与状态控件统一留在 header / 页面主体。 -->
    <!-- registry:begin footer -->
    <footer class="cb-footer game-footer">
        <p class="cb-footer-hint game-footer-hint" id="cb-hint" data-i18n="hint" data-i18n-touch="hintTouch"></p>
    </footer>
    <!-- registry:end footer -->
    </div>
    <!-- 底部统计抽屉（移动端）：面板由 JS 从侧栏搬进来 -->
    <!-- registry:begin stats-drawer -->
    <div class="game-drawer" id="cbStatsDrawer" hidden>
        <div class="game-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="cbStatsDrawerTitle">
            <div class="game-drawer-handle"></div>
            <div class="game-drawer-head">
                <span class="game-drawer-title" id="cbStatsDrawerTitle"></span>
                <button type="button" class="icon-btn game-icon-btn game-drawer-close" id="cbStatsClose" aria-label="Close"></button>
            </div>
            <div class="game-drawer-body" id="cbStatsDrawerBody"></div>
        </div>
    </div>
    <!-- registry:end stats-drawer -->
