<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">御剑飞行 Sword Flight: Soaring Heavens</title>
  <desc id="sf-desc">Social preview for 御剑飞行 Sword Flight — Soar through the Nine Heavens on a flying sword, summon celestial sword arrays, thread spiritual rings, and ascend to immortality.</desc>

  <defs>
    <!-- Background Sky Gradient: Celestial Deep Ink to Mountain Teal -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030816"/>
      <stop offset="35%" stop-color="#071830"/>
      <stop offset="70%" stop-color="#0e2a47"/>
      <stop offset="100%" stop-color="#163e5c"/>
    </linearGradient>

    <!-- Cloud Sea Amber/Gold Twilight Gradient -->
    <linearGradient id="cloudGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Divine Sword Cyan Light Gradient -->
    <linearGradient id="swordBladeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Qi Trail Radiant Stream -->
    <linearGradient id="qiTrailG" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="1200" height="630" fill="url(#skyGrad)"/>

  <!-- Distant Stars and Spirit Dust -->
  <g opacity="0.6">
    <circle cx="150" cy="80" r="1.5" fill="#ffffff"/>
    <circle cx="280" cy="140" r="1" fill="#7dd3fc"/>
    <circle cx="420" cy="60" r="2" fill="#ffffff"/>
    <circle cx="750" cy="90" r="1.5" fill="#fef08a"/>
    <circle cx="890" cy="50" r="1.2" fill="#ffffff"/>
    <circle cx="1020" cy="110" r="2.2" fill="#7dd3fc"/>
    <circle cx="1130" cy="70" r="1" fill="#ffffff"/>
    <circle cx="340" cy="190" r="1.5" fill="#fef08a"/>
    <circle cx="620" cy="130" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Distant Ink Mountains (Layer 1) -->
  <path d="M-50 480 Q120 340 280 410 T620 360 T980 430 T1250 350 L1250 630 L-50 630 Z" fill="#091c33" opacity="0.7"/>
  <!-- Middle Mountain Spires (Layer 2) -->
  <path d="M-20 540 Q180 390 380 470 T780 420 T1150 490 L1250 630 L-50 630 Z" fill="#0d2948" opacity="0.85"/>
  <!-- Floating Celestial Island -->
  <g transform="translate(180, 240)">
    <path d="M0 40 Q40 0 110 15 Q160 30 180 50 Q130 90 90 120 Q50 90 0 40 Z" fill="#081b2e" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <!-- Ancient Pavilion on island -->
    <path d="M70 15 L110 15 L105 0 L75 0 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M60 0 L120 0 L115 -8 L65 -8 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Rolling Cloud Sea Base (Layer 3) -->
  <path d="M-40 560 Q60 510 160 540 T360 520 T560 550 T760 510 T960 540 T1160 520 L1250 630 L-50 630 Z" fill="#133d63" opacity="0.95"/>
  <ellipse cx="280" cy="580" rx="220" ry="60" fill="url(#cloudGold)"/>
  <ellipse cx="850" cy="590" rx="300" ry="70" fill="url(#cloudGold)"/>

  <!-- Celestial Spirit Rings Floating in Space -->
  <!-- Ring 1 (Distant) -->
  <ellipse cx="480" cy="300" rx="45" ry="85" fill="none" stroke="url(#ringG)" stroke-width="4" transform="rotate(-25 480 300)" opacity="0.6" filter="url(#glowGold)"/>
  <!-- Ring 2 (Middle) -->
  <ellipse cx="680" cy="240" rx="65" ry="120" fill="none" stroke="url(#ringG)" stroke-width="6" transform="rotate(-20 680 240)" opacity="0.85" filter="url(#glowGold)"/>
  <!-- Ring 3 (Foreground Threaded) -->
  <ellipse cx="920" cy="180" rx="90" ry="170" fill="none" stroke="url(#ringG)" stroke-width="8" transform="rotate(-15 920 180)" filter="url(#glowGold)"/>

  <!-- Grand Dynamic Qi Sword Trail (Swirling from left through rings) -->
  <path d="M-60 420 C180 430 360 380 500 310 C620 250 720 220 840 210 C960 200 1020 190 1090 170" fill="none" stroke="url(#qiTrailG)" stroke-width="24" stroke-linecap="round" filter="url(#glowCyan)"/>
  <path d="M-60 420 C180 430 360 380 500 310 C620 250 720 220 840 210 C960 200 1020 190 1090 170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Orbiting Companion Swords (Flying in Formation) -->
  <!-- Companion Sword 1 -->
  <g transform="translate(800, 140) rotate(-18)">
    <polygon points="0,-4 40,0 0,4 -6,0" fill="url(#swordBladeG)" filter="url(#glowCyan)"/>
    <path d="M0,0 L-30,0" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- Companion Sword 2 -->
  <g transform="translate(820, 270) rotate(-14)">
    <polygon points="0,-4 40,0 0,4 -6,0" fill="url(#swordBladeG)" filter="url(#glowCyan)"/>
    <path d="M0,0 L-30,0" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- Companion Sword 3 -->
  <g transform="translate(730, 180) rotate(-22)">
    <polygon points="0,-3.5 35,0 0,3.5 -5,0" fill="url(#swordBladeG)" filter="url(#glowCyan)"/>
  </g>
  <!-- Companion Sword 4 -->
  <g transform="translate(750, 250) rotate(-10)">
    <polygon points="0,-3.5 35,0 0,3.5 -5,0" fill="url(#swordBladeG)" filter="url(#glowCyan)"/>
  </g>

  <!-- Hero Cultivator & Celestial Main Flying Sword (Soaring at Right) -->
  <g transform="translate(980, 190) rotate(-16)">
    <!-- Great Flying Sword Underfoot -->
    <!-- Blade glow -->
    <polygon points="-80,-6 110,0 -80,6 -95,0" fill="url(#swordBladeG)" filter="url(#glowCyan)"/>
    <!-- Blade core -->
    <polygon points="-75,-3 105,0 -75,3 -90,0" fill="#ffffff"/>
    <!-- Sword Guard / Hilt -->
    <rect x="-95" y="-12" width="10" height="24" rx="2" fill="#fbbf24"/>
    <rect x="-125" y="-3" width="30" height="6" rx="2" fill="#92400e"/>
    <circle cx="-128" cy="0" r="5" fill="#fbbf24"/>
    <!-- Flowing Red Tassel -->
    <path d="M-132,0 Q-160,10 -190,5 Q-210,18 -230,12" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- Standing Sword Cultivator (Graceful silhouette with cyan/white robes) -->
    <!-- Robes trailing backwards in wind -->
    <path d="M-40,-8 Q-90,-12 -130,-5 Q-160,-2 -190,-15 Q-130,-25 -60,-28 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M-30,-20 Q-70,-35 -120,-30 Q-150,-26 -175,-38 Q-120,-45 -50,-42 Z" fill="#0284c7" opacity="0.85"/>
    <!-- Cultivator Legs & Torso -->
    <path d="M-10,-5 L-15,-35 L-25,-35 L-30,-5 Z" fill="#f8fafc"/>
    <path d="M-12,-35 L-15,-70 L-35,-68 L-32,-35 Z" fill="#0284c7"/>
    <!-- Cloak / Sash -->
    <path d="M-15,-48 Q-40,-52 -90,-48 Q-120,-55 -145,-50 Q-100,-62 -30,-58 Z" fill="#38bdf8"/>
    <!-- Head & Hair with flying ribbon -->
    <circle cx="-25" cy="-78" r="8" fill="#fbcfe8"/>
    <!-- Hair bun & long dark hair streaming back -->
    <path d="M-22,-86 L-32,-84 L-30,-75 L-18,-77 Z" fill="#0f172a"/>
    <path d="M-28,-80 Q-70,-88 -130,-82 Q-160,-90 -185,-85 Q-120,-95 -32,-84 Z" fill="#0f172a"/>
    <!-- Golden hair ribbon -->
    <path d="M-30,-85 Q-65,-92 -110,-98" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sword Hand (Finger Sword Gesture / 剑指) pointing forward -->
    <path d="M-18,-55 L15,-60 L28,-62" fill="none" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="-63" r="3" fill="#38bdf8" filter="url(#glowCyan)"/>
  </g>

  <!-- Front Golden Clouds Floating By -->
  <path d="M780 490 Q920 430 1060 480 T1250 460 L1250 630 L700 630 Z" fill="#0c233c" opacity="0.8"/>
  <ellipse cx="1080" cy="530" rx="160" ry="40" fill="url(#cloudGold)"/>

  <!-- Left Side: Refined Typography & Badge -->
  <!-- Outer glowing card border -->
  <rect x="50" y="45" width="1100" height="540" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <rect x="54" y="49" width="1092" height="532" rx="16" fill="none" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1"/>

  <!-- Text Group -->
  <g transform="translate(90, 110)">
    <!-- Top Genre Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <text x="115" y="22" fill="#7dd3fc" font-family="'Noto Serif SC', 'PingFang SC', 'Source Han Serif', serif" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">ORIENTAL XIANXIA ACTION</text>

    <!-- Chinese Main Title -->
    <text x="0" y="115" fill="#f8fafc" font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif', serif" font-size="78" font-weight="900" letter-spacing="6">御剑飞行</text>
    <!-- Glowing Shadow Accent -->
    <text x="0" y="115" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" font-family="'Noto Serif SC', 'Songti SC', 'Source Han Serif', serif" font-size="78" font-weight="900" letter-spacing="6" filter="url(#glowCyan)">御剑飞行</text>

    <!-- English Subtitle -->
    <text x="4" y="165" fill="#fbbf24" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4">SWORD FLIGHT : SOARING HEAVENS</text>

    <!-- Poetic Tagline -->
    <text x="4" y="215" fill="#94a3b8" font-family="'Noto Serif SC', 'PingFang SC', 'Source Han Serif', serif" font-size="20" font-weight="500" letter-spacing="2">
      扶摇直上九重天 · 剑气纵横御清风
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="65" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">✨ 九天问道 9关</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="120" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="202" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🗡️ 万剑归宗</text>

      <!-- Pill 3 -->
      <rect x="274" y="0" width="120" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="334" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌌 万里长空</text>

      <!-- Pill 4 -->
      <rect x="406" y="0" width="120" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
      <text x="466" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">📅 每日仙缘</text>
    </g>

    <!-- Call to action footer -->
    <g transform="translate(0, 340)">
      <circle cx="16" cy="16" r="16" fill="#38bdf8" opacity="0.2"/>
      <polygon points="12,8 24,16 12,24" fill="#38bdf8"/>
      <text x="46" y="22" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="1">TAP OR CLICK TO SOAR ›</text>
    </g>
  </g>
</svg>
