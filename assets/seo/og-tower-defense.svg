<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="td-title td-desc">
  <title id="td-title">Neon Tower Defense social card</title>
  <desc id="td-desc">Social preview for Neon Tower Defense 霓虹塔防 — strategy TD.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f24"/>
      <stop offset="0.6" stop-color="#111a3e"/>
      <stop offset="1" stop-color="#0c2036"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#40d8ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="towerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#40d8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#40d8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g fill="#dfe7ff">
    <circle cx="160" cy="90" r="2" opacity="0.55"/>
    <circle cx="430" cy="60" r="1.5" opacity="0.45"/>
    <circle cx="700" cy="100" r="1.8" opacity="0.5"/>
    <circle cx="960" cy="70" r="1.4" opacity="0.45"/>
    <circle cx="1100" cy="190" r="2" opacity="0.55"/>
  </g>

  <rect x="48" y="48" width="1104" height="534" rx="26" fill="rgba(0,0,0,0.30)" stroke="#40d8ff" stroke-width="2.5"/>

  <text x="88" y="165" fill="#f4f6ff" font-size="74" font-weight="800" font-family="Segoe UI, system-ui, sans-serif">Neon Tower Defense</text>
  <text x="88" y="228" fill="#40d8ff" font-size="38" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif">霓虹塔防 · 建造升级守护核心</text>
  <text x="88" y="290" fill="#8fa0d8" font-size="28" font-family="Segoe UI, system-ui, sans-serif">Pulse · Frost · Cannon · Tesla — four towers, 25 waves.</text>
  <text x="88" y="334" fill="#8fa0d8" font-size="28" font-family="Segoe UI, system-ui, sans-serif">Upgrade your turrets and defend the neon core!</text>

  <!-- 小地图示意 -->
  <g transform="translate(790 240)">
    <rect x="0" y="0" width="310" height="220" rx="14" fill="rgba(0,0,0,0.35)" stroke="rgba(64,216,255,0.4)" stroke-width="2"/>
    <!-- 路径 -->
    <path d="M30 10 V90 H180 V160 H290" stroke="#141c44" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 10 V90 H180 V160 H290" stroke="url(#road)" stroke-width="3" fill="none" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.8"/>
    <!-- 塔 -->
    <g>
      <rect x="66" y="34" width="34" height="34" rx="8" fill="#141b3f" stroke="#40d8ff" stroke-width="2.4"/>
      <rect x="80" y="44" width="22" height="6" rx="3" fill="#40d8ff" transform="rotate(35 80 44)"/>
      <rect x="220" y="34" width="34" height="34" rx="8" fill="#141b3f" stroke="#c084fc" stroke-width="2.4"/>
      <circle cx="237" cy="51" r="8" fill="none" stroke="#c084fc" stroke-width="2.4"/>
      <rect x="66" y="120" width="34" height="34" rx="8" fill="#141b3f" stroke="#7dd3fc" stroke-width="2.4"/>
      <path d="M76 137h18M85 128v18" stroke="#7dd3fc" stroke-width="2.4"/>
      <rect x="200" y="120" width="34" height="34" rx="8" fill="#141b3f" stroke="#ff9f43" stroke-width="2.4"/>
      <circle cx="217" cy="137" r="6" fill="#ff9f43"/>
    </g>
    <!-- 核心与敌人 -->
    <circle cx="293" cy="160" r="13" fill="#12204a" stroke="#40d8ff" stroke-width="3"/>
    <circle cx="30" cy="52" r="10" fill="#0d1230" stroke="#ff6b7a" stroke-width="2.6"/>
    <circle cx="150" cy="90" r="8" fill="#0d1230" stroke="#ffd34d" stroke-width="2.4"/>
  </g>

  <text x="88" y="552" fill="#e0e7ff" font-size="27" font-weight="600" font-family="Segoe UI, system-ui, sans-serif">🏰 Play in browser · tower-defense</text>
</svg>
